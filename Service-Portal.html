/* guided troubleshooting inside the case form */
const ALARM_PB={Grid:'pb_grid',PV:'pb_noout',Battery:'pb_bat',Isolation:'pb_rcd',Thermal:'pb_derate',Hardware:'pb_service',Comms:'pb_comms'};
let tshootState={key:'',cfg:'',alarm:null,pb:null,checks:[],source:'',checked:{},notes:{}};
let playbookSeed=null;
function alarmFitsSetup(group,fam,hasBat){
  if(group==='Battery') return !!hasBat;
  return fam!=='bat';
}
function tshootMatch(v){
  const model=String(v.model||'').trim();
  if(!model) return {gate:'model', model:'', alarm:null, pb:null, checks:[], source:'', note:'', config:''};
  const prod=kbProductForModel(model);
  if(!prod) return {gate:'unknown', model:model, alarm:null, pb:null, checks:[], source:'', note:'', config:''};
  const fam=kbFamForProduct(prod);
  const hasBat=(prod.id==='bat21') || v.setup==='bat';
  const battModel=hasBat? (prod.id==='bat21'? model : (v.battModel||'vision two 2.1')) : '';
  const config=systemSetupLabel({model:model, setup:v.setup, battModel:v.battModel});
  const alarm=kbAlarm(v.code);
  let pb=null, source='', note='';
  if(alarm){
    source='alarm '+alarm[0];
    if(!alarmFitsSetup(alarm[1],fam,hasBat)){
      note=alarm[1]==='Battery'
        ? 'This is a battery code, but the site setup is inverter only. Confirm the setup or add the battery model before using the checks.'
        : 'This is an inverter code and the selected product is a battery. Add the inverter model to get its checks.';
    } else {
      const pid=ALARM_PB[alarm[1]]||'pb_alarm';
      pb=kbPlaybook(alarm[1]==='PV' && fam==='three'? 'pb_noout3' : pid) || kbPlaybook('pb_alarm');
      if(pb && !pbFitsConfig(pb,fam,hasBat)){
        note='The playbook for this code belongs to a different product or to a site without a battery.';
        pb=null;
      }
    }
  } else if(v.cat && v.cat!=='Other'){
    const strict=KB_PLAYBOOKS.filter(p=>p.cats.indexOf(v.cat)>-1 && pbFitsConfig(p,fam,hasBat));
    pb=strict[0]||null;
    if(pb) source='fault category · '+v.cat;
    else note='No checklist in the knowledge base is relevant to this product and site setup for “'+v.cat+'”.';
  }
  let checks=pb? pb.checks.slice():[];
  if(pb && hasBat && (pb.fam==='bat'||pb.id==='pb_backup') && battModel){
    checks=['Site battery: '+battModel+' ('+kbKwhNum(battModel).toFixed(2)+' kWh). Confirm the installed pack count and the master/pack link before condemning a module.'].concat(checks);
  }
  return {gate:'', model:model, fam:fam, hasBat:hasBat, battModel:battModel, config:config, alarm:alarm||null, pb:pb, checks:checks, source:source, note:note};
}
function tshootKey(m){ return [m.gate,m.pb?m.pb.id:'',m.alarm?m.alarm[0]:'',m.hasBat?'bat':'inv',m.battModel||''].join('|'); }
function tshootJSON(){
  const out=[];
  tshootState.checks.forEach((s,i)=>{
    const note=tshootState.notes[i]||'';
    if(playbookSeed || tshootState.checked[i] || note) out.push({i:i, step:s, note:note, done:!!tshootState.checked[i]});
  });
  return out.length? JSON.stringify(out):'';
}
function tshootHTML(m){
  let h='<div class="ts-head"><span>Guided troubleshooting</span>'+(m.source? '<span class="ts-src">'+esc(m.source)+'</span>':'')+'</div>';
  if(m.gate==='model') return h+'<div class="ts-empty"><b>Choose a model first</b><span>Guided checks follow the exact product. Pick the inverter or battery model above and this panel will load only the playbooks and alarm guidance that belong to it.</span></div>';
  if(m.gate==='unknown') return h+'<div class="ts-empty"><b>Model not in the catalogue</b><span>“'+esc(m.model)+'” has no product record, so no checks can be matched. Choose one of the models from the list, or add the model to the knowledge base first.</span></div>';
  h+='<div class="ts-cfg"><span class="ts-cfg-k">Site setup</span>'+esc(m.config)+'</div>';
  if(m.alarm){
    h+='<div class="alarmbox"><div class="abhead"><span class="acode">'+esc(m.alarm[0])+'</span><span class="badge '+KB_ALARM_TAG[m.alarm[1]]+'">'+esc(m.alarm[1])+'</span></div>'+
      '<p class="amean" style="margin:5px 0 0">'+esc(m.alarm[2])+'</p><p class="aact" style="margin:4px 0 0">First action: '+esc(m.alarm[3])+'</p></div>';
  }
  if(m.note) h+='<div class="ts-note-msg">'+esc(m.note)+'</div>';
  if(m.pb){
    h+='<div class="ts-pb"><b>'+esc(m.pb.title)+'</b><span>'+esc(m.pb.symptom||'')+'</span></div><div class="ts-list">';
    m.checks.forEach((s,i)=>{
      h+='<div class="ts-item"><label class="ts-row"><input type="checkbox" data-tscheck="'+i+'"'+(tshootState.checked[i]?' checked':'')+'>'+
        '<span class="ts-num">'+(i+1)+'</span><span class="ts-step">'+esc(s)+'</span></label>'+
        '<input class="ts-note" data-tsnote="'+i+'" value="'+esc(tshootState.notes[i]||'')+'" placeholder="Reading or note (optional)" autocomplete="off"></div>';
    });
    h+='</div><div class="ts-foot"><span data-ts-count>0 checked</span><span class="ts-acts">'+
      '<button type="button" class="fbtn" data-act="tsAll">Check all</button>'+
      '<button type="button" class="fbtn" data-act="tsClear">Clear</button></span></div>';
    if(m.pb.stop) h+='<div class="ts-warn">Stop: '+esc(m.pb.stop)+'</div>';
    if(m.pb.escalate) h+='<div class="ts-esc">Escalate: '+esc(m.pb.escalate)+'</div>';
  } else if(!m.alarm){
    h+='<div class="ts-empty">Now choose a fault category or type an alarm code. Only checks for this product and site setup will appear.</div>';
  }
  h+='<input type="hidden" name="tshootLog" value="'+esc(tshootJSON())+'">';
  h+='<input type="hidden" name="tshootTitle" value="'+esc(m.pb? m.pb.title:'')+'">';
  return h;
}
function tshootSync(f){
  f=f||document.querySelector('#modal-root form[data-form="case"]');
  if(!f) return;
  const box=f.querySelector('[data-role="tshoot"]'); if(!box) return;
  const hidden=box.querySelector('[name="tshootLog"]');
  const checks=box.querySelectorAll('[data-tscheck]');
  let n=0;
  for(let k=0;k<checks.length;k++){ if(checks[k].checked) n++; }
  if(hidden) hidden.value=tshootJSON();
  const cnt=box.querySelector('[data-ts-count]');
  if(cnt) cnt.textContent=checks.length? (playbookSeed? (n? n+' of '+checks.length+' checked · all steps will be recorded':checks.length+' steps attached · tick as you go') : (n? n+' of '+checks.length+' checked · recorded when you save the case':'0 checked')) : '';
}
function tshootRefresh(){
  const f=document.querySelector('#modal-root form[data-form="case"]');
  if(!f) return;
  const box=f.querySelector('[data-role="tshoot"]'); if(!box) return;
  if(playbookSeed){
    if(!playbookSeed.rendered){
      const m={gate:'', pb:playbookSeed.pb, checks:playbookSeed.checks,
        source:'Troubleshooting playbook',
        config:'Loaded from the playbook · '+kbFamLabel(playbookSeed.pb.fam),
        alarm:null, note:'This checklist comes from the Troubleshooting library and is attached to the case as written. Tick the steps you run and add readings as you go.'};
      tshootState={key:'pb|'+playbookSeed.id, cfg:'seed', alarm:null, pb:playbookSeed.pb,
        checks:playbookSeed.checks, source:m.source, checked:{}, notes:{}};
      box.innerHTML=tshootHTML(m);
      playbookSeed.rendered=true;
    }
    tshootSync(f);
    return;
  }
  const m=tshootMatch({code:formVal(f,'code'), cat:formVal(f,'category'), model:formVal(f,'model'), type:formVal(f,'sysType'), setup:formVal(f,'setup'), battModel:formVal(f,'battModel')});
  const key=tshootKey(m), cfg=(m.hasBat?'bat':'inv')+'|'+(m.battModel||'');
  if(key!==tshootState.key){
    const samePb=(tshootState.pb && m.pb && tshootState.pb.id===m.pb.id && tshootState.cfg===cfg);
    tshootState={key:key, cfg:cfg, alarm:m.alarm, pb:m.pb, checks:m.checks||[], source:m.source,
      checked:samePb? tshootState.checked : {}, notes:samePb? tshootState.notes : {}};
    box.innerHTML=tshootHTML(m);
  }
  tshootSync(f);
}
function tshootAll(v){
  const f=document.querySelector('#modal-root form[data-form="case"]'); if(!f) return;
  const checks=f.querySelectorAll('[data-tscheck]');
  for(let k=0;k<checks.length;k++){ checks[k].checked=v; tshootState.checked[+checks[k].dataset.tscheck]=v; }
  tshootSync(f);
}
function tshootReset(){
  tshootState.key='\u0000';
  tshootRefresh();
}

function catOptionsFor(sel, model, setup, keep){
  const known=kbProductForModel(model);
  let list=CATEGORIES;
  if(known){
    const sys={model:model, setup:setup};
    const fam=kbFamForCase({system:sys}), hasBat=sysHasBattery(sys);
    list=CATEGORIES.filter(c=>c==='Other'|| KB_PLAYBOOKS.some(p=>p.cats.indexOf(c)>-1 && pbFitsConfig(p,fam,hasBat)));
  }
  if(list.indexOf(sel)<0){ if(keep) list=list.concat([sel]); else sel='Other'; }
  return list.map(k=>opt(k,sel)).join('');
}

/* ---------- ACTIONS ---------- */
function moveStage(id, stage){
  const c=byId.case(id);
  if(!c || c.stage===stage) return;
  const from=c.stage, now=Date.now();
  if(STAGE_IDX[stage]<STAGE_IDX['Resolved']){ c.resolvedAt=0; c.closedAt=0; }
  c.stage=stage;
  if(stage==='Resolved' || stage==='Closed'){
    if(!c.resolvedAt) c.resolvedAt=now;
    if(!c.firstResponseAt) c.firstResponseAt=now;
  }
  c.closedAt = stage==='Closed'? now : 0;
  loggedAction(c,'Stage','Service desk','Moved from '+from+' to '+stage+'.', now);
  save(); render(); toast('Case moved to '+stage);
}
function moveToStage(c, stage, by){
  if(c.stage===stage) return;
  if(STAGE_IDX[stage]<STAGE_IDX['Resolved']){ c.resolvedAt=0; c.closedAt=0; }
  if(stage==='Resolved'&&!c.resolvedAt) c.resolvedAt=Date.now();
  if(stage==='Closed'){ if(!c.resolvedAt) c.resolvedAt=Date.now(); c.closedAt=Date.now(); }
  loggedAction(c,'Stage',by||'Service desk','Moved from '+c.stage+' to '+stage+'.');
  c.stage=stage;
}

  exportJSON(){ exportJSON(); },

  clearWork(){

      sample:false, seqC:0, seqE:0};

async function openStoredDoc(id){
  const rec=(DB.docs||[]).find(d=>d.id===id);
  if(!rec) return;
  if(rec.file){
    const w=window.open(rec.file, '_blank');
    if(!w) toast('Allow pop-ups from this page to open the document.');
    return;
  }
  try{
    const blob=await idbGet('doc:'+id, IDB_DOCS);
    if(!blob){ toast('That file is not in this browser any more. Add it again.'); return; }
    const url=URL.createObjectURL(blob);
    const w=window.open(url, '_blank');
    if(!w){ toast('Allow pop-ups from this page to open the document.'); return; }
    setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(err){} }, 60000);
  }catch(err){
    toast('Could not open that file in this browser.');
  }
}

function deleteDoc(id){
  const rec=(DB.docs||[]).find(d=>d.id===id);
  if(!rec) return;
  if(!confirm('Remove "'+rec.title+'" from the library?\n\nThe stored file is deleted from this browser and cannot be brought back by restoring a snapshot.')) return;
  takeSnapshot('manual');
  DB.docs=DB.docs.filter(d=>d.id!==id);
  save();
  idbDel('doc:'+id, IDB_DOCS).catch(()=>{});
  render(); toast('Document removed');
}

/* ---------- SUBMIT ---------- */
function formVal(f,n){
  const el=f.querySelector('[name="'+n+'"]');
  return el? String(el.value).trim() : '';
}
document.addEventListener('submit', async function(e){
  const f=e.target.closest('form[data-form]');
  if(!f) return;
  e.preventDefault();
  const kind=f.dataset.form;

  if(kind==='note'){
    const c=byId.case(f.dataset.id); if(!c) return;
    const text=formVal(f,'text');
    if(!text){ toast('Write what happened first.'); return; }
    const type=formVal(f,'type')||'Note';
    if(!c.firstResponseAt){ c.firstResponseAt=Date.now(); }
    loggedAction(c, type, 'Service desk', text);
    save(); render(); toast('Added to the timeline');
    return;
  }

  if(kind==='case'){
    const id=f.dataset.id;
    const title=formVal(f,'title');
    const insId=formVal(f,'installerId');
    if(!title){ toast('Add a title.'); return; }
    if(!insId && !formVal(f,'companyId')){ toast('Choose an installer from the list, or pick the responsible company.'); return; }
    const ins=byId.ins(insId);
    const now=Date.now();
    let c=id? byId.case(id):null;
    const isNew=!c;
    if(!c){
      c={id:'c_'+now.toString(36), ref:nextRef(), openedAt:now, updatedAt:now,
        firstResponseAt:0, resolvedAt:0, closedAt:0, actions:[], rma:null, enquiryId:''};
      DB.cases.unshift(c);
    }
    c.title=title;
    c.kind=formVal(f,'kind')||'Service call';
    c.priority=formVal(f,'priority')||'P3';
    c.source=formVal(f,'source')||'Installer portal';
    c.owner=formVal(f,'owner');
    c.waiting=formVal(f,'waiting')||'Service team';
    c.installerId=insId;
    c.companyId=formVal(f,'companyId') || (ins? ins.companyId:'');
    c.contact=formVal(f,'contact')||(ins? ins.contact:'');
    c.endUser=formVal(f,'endUser');
    c.site={ addr:formVal(f,'addr'), city:formVal(f,'city'), state:formVal(f,'state') };
    const setup=(formVal(f,'setup')==='bat')? 'bat':'inv';
    c.system={ type:formVal(f,'sysType'), model:formVal(f,'model'), serial:formVal(f,'serial'),
      capacity:formVal(f,'capacity'), commissioned:formVal(f,'commissioned'), warrantyEnd:formVal(f,'warrantyEnd'),
      setup:setup, battModel: setup==='bat'? formVal(f,'battModel') : '' };
    c.fault={ category:formVal(f,'category')||'Other', code:formVal(f,'code'), description:formVal(f,'description') };
    c.resolution={ cause:formVal(f,'cause'), fix:formVal(f,'fix'),
      hours:Number(formVal(f,'hours'))||0, cost:Number(formVal(f,'cost'))||0 };

    const stage=formVal(f,'stage')||'Intake';
    if(isNew){
      c.stage=stage;
      loggedAction(c,'Intake', (ins? ins.contact+' · '+ins.company:'Service desk'),
        'Case logged via '+c.source+'. '+c.fault.description, now);
      if(c.fault.description) c.actions[c.actions.length-1].text='Case logged via '+c.source+'. '+c.fault.description;
      if(stage!=='Intake'){ c.firstResponseAt=now; }
    } else if(stage!==c.stage){
      moveToStage(c, stage, 'Service desk');
    }
    if(stage==='Resolved' && !c.resolvedAt) c.resolvedAt=now;
    if(stage==='Closed'){
      if(!c.resolvedAt) c.resolvedAt=now;
      if(!c.closedAt) c.closedAt=now;
    }
    if(stage!=='Closed') c.closedAt=0;

    const enqId=formVal(f,'enqId');
    if(enqId){
      c.enquiryId=enqId;
      const en=byId.enq(enqId);
      if(en){ en.caseId=c.id; en.status='Escalated'; en.updatedAt=now; }
    }
    const tsRaw=formVal(f,'tshootLog');
    if(tsRaw){
      try{
        const ts=JSON.parse(tsRaw);
        if(Array.isArray(ts) && ts.length){
          const tsTitle=formVal(f,'tshootTitle');
          const head=tsTitle || ((c.fault.code? 'Alarm '+c.fault.code+' · ':'')+(c.fault.category||'Guided checks'));
          const lines=ts.map((x,n)=>(n+1)+'. '+(x.done? '✓ ':'')+x.step+(x.note? ' — '+x.note:''));
          const text=head+'\n'+lines.join('\n');
          const dup=c.actions.some(a=>a.type==='Troubleshooting' && a.text===text);
          if(!dup) loggedAction(c,'Troubleshooting', c.owner||'Service desk', text, now);
        }
      }catch(err){ console.warn('troubleshooting log unreadable', err); }
    }
    c.updatedAt=now;
    save(); closeModal(true); render();
    toast(isNew? 'Case '+c.ref+' logged' : 'Case '+c.ref+' saved');
    return;
  }

  if(kind==='commcase'){
    const c=byId.case(formVal(f,'caseId'));
    if(!c){ toast('Choose a case.'); return; }
    const s=commLoad();
    const ins=s.installerId? byId.ins(s.installerId):null;
    const note=formVal(f,'note');
    const text=commSummary()+(note? '\n\nService note: '+note:'');
    const dup=c.actions.some(a=>a.type==='Commissioning' && a.text===text);
    if(!dup) loggedAction(c,'Commissioning', ins? insFullName(ins)+' · '+companyNameOf(ins):'Service desk', text);
    c.updatedAt=Date.now();
    save(); closeModal(true); render();
    toast(dup? 'That commissioning record is already on the case' : 'Commissioning logged to '+c.ref);
    return;
  }

  if(kind==='enq'){
    const id=f.dataset.id;
    const insId=formVal(f,'installerId');
    const q=formVal(f,'question');
    if(!insId){ toast('Choose an installer from the list, or add a new one.'); return; }
    if(!q){ toast('Write the question.'); return; }
    const status=formVal(f,'status')||'Open';
    const caseId=formVal(f,'caseId');
    if(status==='Escalated' && !caseId){ toast('Link a case, or open one from the enquiry page.'); return; }
    const now=Date.now();
    let e=id? byId.enq(id):null;
    const isNew=!e;
    if(!e){ e={id:'e_'+now.toString(36), ref:nextEnqRef(), at:now, updatedAt:now, caseId:''}; DB.enquiries.unshift(e); }
    if(e.caseId && e.caseId!==caseId){ const old=byId.case(e.caseId); if(old && old.enquiryId===e.id) old.enquiryId=''; }
    e.installerId=insId;
    e.contact=formVal(f,'contact')||(byId.ins(insId)? byId.ins(insId).contact:'');
    e.channel=formVal(f,'channel')||'Phone';
    e.topic=formVal(f,'topic')||'Other';
    e.mins=Number(formVal(f,'mins'))||0;
    e.question=q;
    e.answer=formVal(f,'answer');
    e.caseId=caseId;
    e.status=caseId? 'Escalated' : status;
    e.updatedAt=now;
    if(caseId){ const c=byId.case(caseId); if(c) c.enquiryId=e.id; }
    save(); closeModal(true); render();
    toast(isNew? 'Enquiry '+e.ref+' logged':'Enquiry '+e.ref+' saved');
    return;
  }

  if(kind==='ins'){
    const id=f.dataset.id;
    const company=formVal(f,'company');
    if(!company){ toast('A company name is needed.'); return; }
    const now=Date.now();
    let i=id? byId.ins(id):null;
    if(!i){ i={id:'i_'+now.toString(36)}; DB.installers.push(i); }
    i.company=company;
    i.tier=formVal(f,'tier')||'Authorised installer';
    i.city=formVal(f,'city');
    i.state=formVal(f,'state');
    i.country=formVal(f,'country');
    i.first=formVal(f,'first');
    i.last=formVal(f,'last');
    i.contact=(i.first+' '+i.last).trim() || formVal(f,'contact') || i.contact;
    i.role=formVal(f,'role');
    i.phone=formVal(f,'phone');
    i.email=formVal(f,'email');
    i.accredited=formVal(f,'accredited')||'No';
    i.trainedAt=formVal(f,'trainedAt');
    const co=ensureCompany(i.company,{tier:i.tier, city:formVal(f,'city'), state:formVal(f,'state'), country:formVal(f,'country'), phone:formVal(f,'phone'), email:formVal(f,'email')});
    i.companyId=co? co.id:'';
    i.company=co? co.name : i.company;
    i.contractTo=formVal(f,'contractTo');
    save(); closeModal(true); render(); toast(id? 'Installer saved':'Installer added');
    return;
  }

  if(kind==='comp'){
    const id=f.dataset.id, name=formVal(f,'name');
    if(!name){ toast('A company name is needed.'); return; }
    let c=id? DB.companies.filter(x=>x.id===id)[0]:null;
    const dup=DB.companies.filter(x=>x.name.toLowerCase()===name.toLowerCase() && (!c||x.id!==c.id))[0];
    if(dup){ toast('“'+name+'” is already in the list. Choose it instead of creating a duplicate.'); return; }
    if(!c){
      c=ensureCompany(name,{tier:formVal(f,'tier'),city:formVal(f,'city'),state:formVal(f,'state'),country:formVal(f,'country'),phone:formVal(f,'phone'),email:formVal(f,'email')});
      if(!c){ toast('Could not add that company.'); return; }
    }
    const oldName=c.name;
    c.name=name;
    c.tier=formVal(f,'tier')||'Authorised installer';
    c.phone=formVal(f,'phone');
    c.email=formVal(f,'email');
    c.city=formVal(f,'city');
    c.state=formVal(f,'state');
    c.country=formVal(f,'country');
    c.notes=formVal(f,'notes');
    if(oldName!==name){ DB.installers.filter(i=>i.companyId===c.id).forEach(i=>{ i.company=name; }); }
    save(); closeModal(true); render(); toast(id?'Company saved':'Company added');
    return;
  }

  if(kind==='rma'){
    const c=byId.case(f.dataset.id);
    if(!c) return;
    const part=formVal(f,'part');
    if(!part){ toast('What part is being sent?'); return; }
    const now=Date.now();
    c.rma={ no:formVal(f,'no')||('RMA-'+(3100+DB.cases.length)), part:part,
      carrier:formVal(f,'carrier'), tracking:formVal(f,'tracking'),
      raised:isoToTs(formVal(f,'raised'))||now,
      shipped:isoToTs(formVal(f,'shipped'))||0 };
    if(STAGE_IDX[c.stage]<STAGE_IDX['Parts / RMA']) moveToStage(c,'Parts / RMA','Service desk');
    loggedAction(c,'Parts','Service desk','RMA '+c.rma.no+' raised for '+part+'. '+(c.rma.carrier? 'Dispatch booked with '+c.rma.carrier+'.':''));
    save(); closeModal(true); render(); toast('RMA '+c.rma.no+' saved');
    return;
  }

  if(kind==='doc'){
    const title=formVal(f,'title');
    const input=f.querySelector('[name="file"]');
    const file=input && input.files && input.files[0] ? input.files[0] : null;
    if(!title){ toast('Give the document a title.'); return; }
    if(!file){ toast('Choose the file to add.'); return; }
    if(file.size>25*1024*1024){ toast('That file is over 25 MB. Keep the largest manuals on the team drive.'); return; }
    const id='d_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    try{
      const buf=await file.arrayBuffer();
      await idbPut('doc:'+id, new Blob([buf], {type:file.type||'application/octet-stream'}), IDB_DOCS);
    }catch(err){
      toast('Could not store the file — browser storage may be full or blocked.');
      return;
    }
    DB.docs.push({ id:id, title:title, type:formVal(f,'type')||'Other',
      product:formVal(f,'product')||'all', version:formVal(f,'version'),
      notes:formVal(f,'notes'), size:file.size, at:Date.now() });
    save(); closeModal(true); state.kbTab='docs'; render(); toast('Document added');
    return;
  }

  if(kind==='commgroup'){
    const stage=formVal(f,'stage');
    const title=formVal(f,'title');
    const intro=formVal(f,'intro');
    if(!stage){ toast('Give the stage a name.'); return; }
    if(!title){ toast('Add a stage heading.'); return; }
    const gid=f.dataset.id;
    const cs=commLoad();
    const steps=[];
    f.querySelectorAll('[data-steprow]').forEach(row=>{
      const t=String((row.querySelector('[data-stept]')||{}).value||'').trim();
      const d=String((row.querySelector('[data-stepd]')||{}).value||'').trim();
      if(!t) return;
      const sid=row.dataset.sid || uid('s');
      const step={t:t,d:d,sid:sid};
      let models=[];
      try{ models=JSON.parse(row.dataset.models||'[]'); }catch(err){ models=[]; }
      if(Array.isArray(models) && models.length) step.models=models;
      const bat=row.querySelector('[data-stepbat]');
      if(bat && bat.checked) step.needs='bat';
      if(gid){
        const oldSid=row.dataset.sid;
        const oldIdx=row.dataset.oldidx;
        const oldKey=oldSid? gid+':'+oldSid : (oldIdx!==''? gid+':'+oldIdx:'');
        const newKey=gid+':'+sid;
        if(oldKey && oldKey!==newKey){
          if(cs.checked[oldKey]!==undefined) cs.checked[newKey]=cs.checked[oldKey];
          if(cs.notes[oldKey]!==undefined) cs.notes[newKey]=cs.notes[oldKey];
        }
      }
      steps.push(step);
    });
    if(!steps.length){ toast('Add at least one step with a title.'); return; }
    const src=commGroupSource();
    const g=gid? src.find(x=>x.id===gid):null;
    if(g){
      g.stage=stage; g.title=title; g.intro=intro; g.steps=steps;
    } else {
      src.push({id:uid('g'), stage:stage, title:title, intro:intro, steps:steps});
    }
    save(); commSave();
    const s=commLoad();
    if(s.stage!=='all' && commStageNames().indexOf(s.stage)<0){ s.stage='all'; commSave(); }
    closeModal(true); render();
    toast(g? 'Stage updated — saved for future sessions' : 'New stage added — saved for future sessions');
    return;
  }

  if(kind==='settings'){
    DB.settings.currency=formVal(f,'currency')||'AUD';
    const team=formVal(f,'team');
    DB.settings.team=team? team.split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean).slice(0,12) : [];
    ['P1','P2','P3'].forEach(p=>{
      const r=Math.max(1,Number(formVal(f,'resp'+p))||1);
      const d=Math.max(1,Number(formVal(f,'res'+p))||1);
      DB.settings.sla[p]=[Math.min(r,8760), Math.min(d,8760)];
    });
    save(); render(); toast('Settings saved');
    return;
  }
});

document.addEventListener('input', function(e){
  if(!e.target.closest || !e.target.closest('form[data-form="case"]')) return;
  if(e.target.matches && e.target.matches('[data-tsnote]')){
    tshootState.notes[+e.target.dataset.tsnote]=e.target.value;
    tshootSync();
    return;
  }
  if(e.target.name==='model'){
    const cap=kbCapacityForModel(e.target.value), prod=kbProductForModel(e.target.value);
    const f=e.target.form;
    if(f && cap){ const cf=f.querySelector('[name="capacity"]'); if(cf) cf.value=cap; }
    if(f && prod && SYS_TYPES.indexOf(prod.kind)>-1){ const tf=f.querySelector('[name="sysType"]'); if(tf) tf.value=prod.kind; }
    if(f && prod && prod.id==='bat21'){
      const sf=f.querySelector('[name="setup"]'); if(sf) sf.value='bat';
      const bf=f.querySelector('[name="battModel"]'); if(bf){ bf.value=e.target.value; bf.disabled=false; }
    }
    if(f) syncSetupFields(f);
    if(f) syncCategoryOptions(f);
    tshootRefresh();
    return;
  }
  if(e.target.name==='setup' || e.target.name==='battModel'){
    syncSetupFields(e.target.form);
    syncCategoryOptions(e.target.form);
    tshootRefresh();
    return;
  }
  if(e.target.name==='code' || e.target.name==='category') tshootRefresh();
});
document.addEventListener('change', function(e){
  const f=e.target.closest? e.target.closest('form[data-form="case"]') : null;
  if(!f) return;
  if(e.target.matches && e.target.matches('[data-tscheck]')){
    tshootState.checked[+e.target.dataset.tscheck]=e.target.checked;
    tshootSync(f);
    return;
  }
  if(e.target.name==='model'){
    const cap=kbCapacityForModel(e.target.value), prod=kbProductForModel(e.target.value);
    if(cap){ const cf=f.querySelector('[name="capacity"]'); if(cf) cf.value=cap; }
    if(prod && SYS_TYPES.indexOf(prod.kind)>-1){ const tf=f.querySelector('[name="sysType"]'); if(tf) tf.value=prod.kind; }
    if(prod && prod.id==='bat21'){
      const sf=f.querySelector('[name="setup"]'); if(sf) sf.value='bat';
      const bf=f.querySelector('[name="battModel"]'); if(bf){ bf.value=e.target.value; bf.disabled=false; }
    }
    syncSetupFields(f);
    syncCategoryOptions(f);
    tshootRefresh();
    return;
  }
  if(e.target.name==='setup' || e.target.name==='battModel'){
    syncSetupFields(f);
    syncCategoryOptions(f);
    tshootRefresh();
    return;
  }
  if(e.target.name==='code' || e.target.name==='category' || e.target.name==='sysType') tshootRefresh();
});
document.addEventListener('focusin', function(e){
  const role=e.target.dataset? e.target.dataset.role : '';
  if(role!=='insPick') return;
  const box=e.target.closest? e.target.closest('[data-picker="ins"]') : null;
  const hid=box? box.querySelector('[name="installerId"]') : null;
  if(!hid || !hid.value) insPickRender(e.target,true);
});
document.addEventListener('click', function(e){
  if(e.target.closest && e.target.closest('[data-picker="ins"]')) return;
  const open=document.querySelectorAll('.picklist.on');
  for(let n=0;n<open.length;n++) open[n].classList.remove('on');
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape' && modalOpen){ closeModal(); return; }
  if(e.key==='Enter' && e.target.closest && e.target.closest('[data-panel="ins"]')){
    e.preventDefault(); ACT.insQuickAdd(e.target); return;
  }
  if((e.key==='Enter'||e.key===' ') && e.target.matches && e.target.matches('[role="button"][data-act]')){
    e.preventDefault();
    e.target.click();
  }
});
window.addEventListener('beforeunload', function(e){
  if(hasUnsaved()){ writeDraft(); e.preventDefault(); e.returnValue=''; }
});

/* ---------- CSV / EXPORT ---------- */
function csvCell(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }
function csvText(rows){ return '\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'); }
function download(name, text, mime){
  const blob=new Blob([text],{type:mime||'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 2000);
}
function dISO(ts){ return ts? isoOfTs(ts):''; }
const CASE_CSV_HEAD=['Ref','Title','Installer','Installer company','Responsible company','Type','Priority','Stage','Owner','Waiting on','Opened','First response','Resolved','Closed','Warranty','Chargeable','Cost','System type','Model','Serial','Capacity','Site setup','Battery configuration','Battery bank kWh','Fault category','Fault code','End user','Site city','State','Enquiry'];
function caseCsvRow(c){
  const w=warrantyOf(c), res=c.resolution||{}, ins=byId.ins(c.installerId), sys=c.system||{};
  return [c.ref,c.title,insName(c.installerId),ins? companyNameOf(ins):'',compName(c.companyId),c.kind,c.priority,c.stage,c.owner||'Unassigned',c.waiting,
    dISO(c.openedAt),dISO(c.firstResponseAt),dISO(c.resolvedAt),dISO(c.closedAt),w.t,w.charge?'Yes':'No',res.cost||0,
    sys.type,sys.model,sys.serial,sys.capacity,systemSetupLabel(sys),
    systemSetup(sys)==='bat'? systemBattModel(sys):'',
    systemSetup(sys)==='bat'? systemBattKwh(sys).toFixed(2):'0',
    (c.fault||{}).category,(c.fault||{}).code,c.endUser,(c.site||{}).city,(c.site||{}).state,
    (byId.enq(c.enquiryId)||{}).ref||''];
}
function exportCasesCSV(){
  download('solarwatt-cases-'+todayISO()+'.csv', csvText([CASE_CSV_HEAD].concat(DB.cases.map(caseCsvRow))));
  toast('Cases exported');
}
function exportEnqCSV(){
  const head=['Ref','Logged','Installer','Contact','Channel','Topic','Question','Answer','Minutes','Status','Case'];
  const rows=DB.enquiries.map(e=>[e.ref,dISO(e.at),insName(e.installerId),e.contact,e.channel,e.topic,
    e.question,e.answer,e.mins,e.status,(byId.case(e.caseId)||{}).ref||'']);
  download('solarwatt-enquiries-'+todayISO()+'.csv', csvText([head].concat(rows)));
  toast('Enquiries exported');
}
function exportInsCSV(){
  const head=['Company','Subcontracted to','First name','Last name','Phone','Email','Role','Tier','Accredited','Training completed','City','State','Country','Open cases','Cases all time','Last contact'];
  const rows=DB.installers.slice().sort((a,b)=>companyNameOf(a).localeCompare(companyNameOf(b))||insFullName(a).localeCompare(insFullName(b))).map(i=>[
    companyNameOf(i),(i.contractTo&&i.contractTo!==i.companyId)?compName(i.contractTo):'',i.first,i.last,i.phone,i.email,i.role,i.tier,i.accredited||'No',i.trainedAt||'',
    i.city,i.state,i.country,
    DB.cases.filter(c=>c.installerId===i.id && c.stage!=='Closed').length,
    DB.cases.filter(c=>c.installerId===i.id).length,
    stroke(lastTouch(i.id))
  ]);
  download('solarwatt-installer-register-'+todayISO()+'.csv', csvText([head].concat(rows)));
  toast('Installer register exported');
}
function exportReportCSV(){
  const {from,to,cases,closed,enq}=reportSet();
  const period=fmtISO(from)+' – '+fmtISO(to);
  const avg=closed.length? Math.round(closed.reduce((s,c)=>s+(c.resolvedAt-c.openedAt),0)/closed.length/86400000*10)/10 : 0;
  const met=closed.filter(c=>slaState(c).resOK===true).length;
  const head=['SOLARWATT service report',''];
  const rows=[
    head,
    ['Period',period],
    ['Cases opened',cases.length],
    ['Cases resolved',closed.length],
    ['Average resolution, days',avg],
    ['SLA met',closed.length? met+' of '+closed.length : '—'],
    ['Enquiries logged',enq.length],
    [],
    CASE_CSV_HEAD
  ].concat(cases.map(caseCsvRow));
  download('solarwatt-service-report-'+from+'_'+to+'.csv', csvText(rows));
  toast('Report exported');
}
function exportJSON(){
  download('solarwatt-service-'+todayISO()+'.json',
    JSON.stringify({exported:new Date().toISOString(), app:'SOLARWATT Service Portal', data:DB},null,2),
    'application/json');
  toast('JSON exported');
}
function importFile(el){
  const file=el.files && el.files[0];
  if(!file) return;
  const r=new FileReader();
  r.onload=function(){
    let obj;
    try{ obj=JSON.parse(String(r.result)); }
    catch(err){ toast('That file is not readable JSON.'); return; }
    if(!confirm('Replace everything in this browser with '+file.name+'?\n\nA snapshot of the current data is taken first.')) return;
    applyRestore(obj,'Imported '+file.name);
  };
  r.onerror=function(){ toast('Could not read that file.'); };
  r.readAsText(file);
  el.value='';
}

/* ---------- BOOT ---------- */
function boot(){
  const had=load();
  if(!had){
    const seed=buildSeed();
    DB.settings=seed.settings;
    DB.installers=seed.installers;
    DB.cases=seed.cases;
    DB.enquiries=seed.enquiries;
    DB.docs=[];
    DB.companies=[];
    normalizeDB();
    save();
  }
  seedDocs();
  if(!location.hash) location.hash='#/dashboard';
  render();
  if(typeof initBackup==='function') initBackup();
  setInterval(function(){
    if(document.visibilityState==='visible') markTabs();
  }, 60000);
}
window.addEventListener('hashchange', function(){
  if(modalOpen) closeModal(true);
  render();
  window.scrollTo(0,0);
});
boot();
</script>

if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
