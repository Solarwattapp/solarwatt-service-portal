<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLARWATT Service Portal</title>
<meta name="theme-color" content="#0B5754">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SOLARWATT Service">
<meta name="application-name" content="SOLARWATT Service Portal">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230B5754'/%3E%3Cpath d='M3.5 12.5h4l2-4.8 3 9.2 2.5-6 1.6 1.6h3.9' stroke='%23fff' stroke-width='1.9' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Sora:wght@400;600;700&amp;display=swap">
<style>
/* ===== 1. TOKENS ===== */
:root{
  --ink:#10202A; --ink2:#495966; --ink3:#7C8A94;
  --paper:#EDF2F3; --card:#FFFFFF; --line:#D9E2E5; --line2:#EAEFF1;
  --teal:#0B5754; --teal2:#074340; --teal-soft:#DFEDEA;
  --amber:#9A6714; --amber-soft:#F8EFDD;
  --rust:#9B3529; --rust-soft:#F7E3E0;
  --green:#215F45; --green-soft:#E1EEE7;
  --blue:#25547C; --blue-soft:#E2ECF4;
  --violet:#6B4A8C; --violet-soft:#F1ECF6;
  --r:6px; --rs:3px;
  --f:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --d:"Sora",var(--f);
  --m:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;
}
/* ===== 2. BASE ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/1.55 var(--f)}
h1,h2,h3{margin:0;font-family:var(--d);letter-spacing:-.015em;font-weight:600}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
::selection{background:var(--teal-soft)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ===== 3. TOP BAR ===== */
.bar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding:9px 14px;display:grid;grid-template-columns:1fr auto;grid-template-areas:"brand act" "tabs tabs";gap:8px 12px;align-items:center}
@media(min-width:860px){
  .bar-in{grid-template-columns:auto 1fr auto;grid-template-areas:"brand tabs act";gap:20px;padding:0 22px;height:58px}
}
.brand{grid-area:brand;display:flex;align-items:center;gap:9px;min-width:0}
.mark{width:26px;height:26px;flex:none;display:grid;place-items:center}
.brand-t{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand-t b{font-family:var(--d);font-size:15px;font-weight:700;letter-spacing:-.02em}
.brand-t i{font-style:normal;font-size:10.5px;color:var(--ink3);letter-spacing:.08em}
.bar-act{grid-area:act;display:flex;align-items:center;gap:8px;justify-self:end}
.gsearch{display:none}
@media(min-width:860px){
  .gsearch{display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:var(--rs);background:#fff;width:236px}
  .gsearch input{border:0;outline:0;width:100%;background:none;font-size:13px}
  .gsearch input::placeholder{color:var(--ink3)}
}
.tabs{grid-area:tabs;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -2px}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:var(--rs);font-size:13px;font-weight:500;color:var(--ink2);white-space:nowrap;flex:none;transition:background .14s,color .14s}
.tab:hover{background:#F4F8F8;color:var(--ink)}
.tab.on{background:var(--teal);color:#fff;font-weight:600}
@media(min-width:860px){.tab{height:32px;font-size:12.5px;padding:0 11px}}
.tab .cnt{font-family:var(--m);font-size:10.5px;padding:1px 5px;border-radius:3px;background:var(--rust);color:#fff}
.tab.on .cnt{background:rgba(255,255,255,.22);color:#fff}

/* ===== 4. LAYOUT & PRIMITIVES ===== */
.view{max-width:1180px;margin:0 auto;padding:14px 14px 46px}
@media(min-width:768px){.view{padding:22px 22px 56px}}
.pg-head{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
@media(min-width:768px){.pg-head{flex-direction:row;align-items:flex-end;justify-content:space-between;gap:20px}}
.pg-head h1{font-size:21px;line-height:1.2}
@media(min-width:768px){.pg-head h1{font-size:25px}}
.sub{font-size:12.5px;color:var(--ink3);margin:3px 0 0}
.pg-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:var(--rs);background:#fff;font-size:13px;font-weight:500;color:var(--ink);transition:background .14s,border-color .14s;white-space:nowrap}
.btn:hover{background:#F6FAFA;border-color:#C8D3D7}
.btn:active{transform:translateY(.5px)}
.btn-p{background:var(--teal);border-color:var(--teal);color:#fff}
.btn-p:hover{background:var(--teal2);border-color:var(--teal2)}
.btn-g{border-color:transparent;background:transparent;color:var(--ink2)}
.btn-g:hover{background:#F4F8F8;color:var(--ink)}
.btn-d{color:var(--rust);border-color:#E6CDC9}
.btn-d:hover{background:var(--rust-soft)}
.btn-sm{min-height:28px;padding:0 8px;font-size:12px}
.btn-ico{width:30px;min-height:30px;padding:0;border-radius:var(--rs)}
@media(max-width:767px){.btn{min-height:40px}.btn-sm{min-height:34px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line2)}
.card-h h2{font-size:13.5px;font-weight:600}
.card-h .hint{font-size:11.5px;color:var(--ink3)}
.card-b{padding:12px 13px}
.card-b.tight{padding:0}
.stack{display:grid;gap:12px}
.g2{display:grid;gap:12px}
@media(min-width:768px){.g2{grid-template-columns:1fr 1fr}}
.g3{display:grid;gap:12px}
@media(min-width:900px){.g3{grid-template-columns:1.6fr 1fr}}
.only-wide{display:none}
.only-narrow{display:block}
@media(min-width:768px){.only-wide{display:block}.only-narrow{display:none}}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.badge i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.85;flex:none}
.b-good{background:var(--green-soft);color:var(--green)}
.b-watch{background:var(--amber-soft);color:var(--amber)}
.b-risk{background:var(--rust-soft);color:var(--rust)}
.b-idle{background:#E9EDEF;color:var(--ink3)}
.copybtn{display:inline-flex;align-items:center;justify-content:center;height:26px;padding:0 8px;border:1px solid var(--line);border-radius:5px;background:#fff;font:inherit;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap;flex:none}
.copybtn:hover{border-color:var(--teal);background:#F4FAF9;color:var(--teal)}
.copybtn:active{transform:translateY(.5px)}
.acode-tools{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap}
.acode-tools .badge{margin-top:0}
.pb-acts{display:flex;align-items:center;gap:5px;flex:none}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.b-teal{background:var(--teal-soft);color:var(--teal)}
.b-violet{background:var(--violet-soft);color:var(--violet)}

/* ===== 5. TABLES ===== */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
.tbl th{font-size:11.5px;font-weight:600;color:var(--ink3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FAFCFC}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:#F7FBFB}
.tbl .sub2{display:block;font-size:11px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis}
.tbl th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
.tbl th.sortable:hover{background:#F0F5F5;color:var(--ink)}
.sarrow{display:inline-block;margin-left:4px;font-size:10px;opacity:.32}
.sarrow.on{opacity:1;color:var(--teal);font-weight:700}
.code{font-family:var(--m);font-size:11.5px;letter-spacing:.04em}

/* ===== 6. KPI ===== */
.kpis{display:grid;gap:9px;grid-template-columns:repeat(2,1fr);margin-bottom:12px}
@media(min-width:768px){.kpis{grid-template-columns:repeat(4,1fr);gap:12px}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:11px 12px}
.kpi .lab{font-size:11.5px;color:var(--ink3);display:flex;align-items:center;gap:5px}
.kpi .val{font-family:var(--d);font-size:21px;font-weight:600;line-height:1.25;margin-top:5px;font-variant-numeric:tabular-nums}
@media(min-width:768px){.kpi .val{font-size:23px}}
.kpi .fo{font-size:11px;color:var(--ink3);margin-top:2px}
.kpi.alert{border-left:3px solid var(--rust)}

/* ===== 7. LISTS ===== */
.row{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:0}
.row:hover{background:#F8FBFB}
.row .grow{flex:1;min-width:0}
.row b{font-weight:600;font-size:13px}
.row .meta{font-size:11.5px;color:var(--ink3);display:block;overflow:hidden;text-overflow:ellipsis}
.empty{padding:26px 14px;text-align:center;color:var(--ink3);font-size:12.5px}
.empty b{display:block;color:var(--ink2);font-size:13px;margin-bottom:3px;font-family:var(--d)}

/* ===== 8. CHARTS ===== */
.chart-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.chart-h b{font-family:var(--d);font-size:13px;font-weight:600}
.chart-h span{font-size:11.5px;color:var(--ink3)}
.barchart{position:relative;padding-top:6px}
.barchart .ymax{position:absolute;top:0;left:0;font-size:10.5px;color:var(--ink3);font-family:var(--m)}
.bc-cols{display:flex;align-items:flex-end;gap:5px;height:118px;border-bottom:1px solid var(--line);margin-top:14px}
.bc-col{flex:1;min-width:0;height:100%;display:grid;grid-template-rows:1fr 16px}
.bc-fw{display:flex;align-items:flex-end;justify-content:center;gap:2px}
.bc-fill{width:100%;max-width:15px;background:var(--teal);border-radius:2px 2px 0 0;min-height:2px}
.bc-fill.zero{background:var(--line);min-height:2px}
.bc-fill.two{background:#9EBDB8;max-width:15px}
.bc-x{font-size:9.5px;color:var(--ink3);text-align:center;white-space:nowrap;overflow:hidden;font-family:var(--m);padding-top:3px}
.hbars{display:grid;gap:9px}
.hbar{display:grid;grid-template-columns:1fr;gap:3px}
.hbar .hb-top{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.hbar .hb-top span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .hb-top b{font-family:var(--m);font-weight:600;flex:none}
.hb-track{height:6px;background:#EDF1F2;border-radius:3px;overflow:hidden}
.hb-fill{height:100%;background:var(--teal);border-radius:3px}
.segbar{display:flex;height:10px;border-radius:2px;overflow:hidden;background:#EDF1F2;margin-bottom:11px}
.segbar div{height:100%}
.legend{display:grid;gap:6px}
.lg{display:flex;align-items:center;gap:7px;font-size:12px}
.lg i{width:8px;height:8px;border-radius:2px;flex:none}
.lg span{flex:1;color:var(--ink2)}
.lg b{font-family:var(--m);font-weight:600}

/* ===== 9. FORMS / MODAL ===== */
.modal-back{position:fixed;inset:0;z-index:70;background:rgba(12,26,34,.42);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:768px){.modal-back{align-items:center;padding:24px}}
.modal{background:#fff;width:100%;max-width:660px;max-height:94vh;display:flex;flex-direction:column;border-radius:10px 10px 0 0;box-shadow:0 30px 70px -24px rgba(0,0,0,.45);overflow:hidden}
@media(min-width:768px){.modal{border-radius:8px;max-height:88vh}}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line2);flex:none}
.m-head h2{font-size:15px}
.m-body{padding:14px 15px;overflow-y:auto}
.m-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 15px;border-top:1px solid var(--line2);flex:none}
.field{margin-bottom:12px}
.field>label{display:block;font-size:11.5px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.inp{width:100%;height:40px;padding:0 10px;border:1px solid var(--line);border-radius:var(--rs);background:#fff;font-size:16px;color:var(--ink)}
@media(min-width:768px){.inp{height:34px;font-size:13.5px}}
.inp:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px rgba(11,87,84,.1)}
textarea.inp{height:auto;min-height:76px;padding:9px 10px;resize:vertical;line-height:1.5}
@media(max-width:767px){textarea.inp{font-size:16px}}
.frow{display:grid;gap:0 12px}
@media(min-width:560px){.frow.two{grid-template-columns:1fr 1fr}.frow.three{grid-template-columns:1fr 1fr 1fr}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative;display:inline-flex;align-items:center;min-height:32px;padding:0 10px;border:1px solid var(--line);border-radius:var(--rs);font-size:12.5px;color:var(--ink2);cursor:pointer;background:#fff}
.seg label input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--teal-soft);border-color:#9EC2BD;color:var(--teal);font-weight:600}
.seg label:has(input:focus-visible){outline:2px solid var(--teal);outline-offset:1px}
@media(max-width:767px){.seg label{min-height:38px}}

/* ===== 10. MISC ===== */
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);z-index:80;background:var(--ink);color:#fff;font-size:13px;padding:9px 14px;border-radius:5px;box-shadow:0 10px 30px -8px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:88vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.kv{display:grid;gap:9px}
.kv-row{display:grid;grid-template-columns:96px 1fr;gap:10px;font-size:12.5px}
.kv-row dt{color:var(--ink3)}
.kv-row dd{margin:0;color:var(--ink);word-break:break-word}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--teal-soft);border:1px solid #C3DCD8;border-radius:var(--r);padding:11px 13px;font-size:12.5px;color:var(--teal2)}
.notice .grow{flex:1;min-width:0}
.filterbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.fbtn{display:inline-flex;align-items:center;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:var(--rs);background:#fff;font-size:12px;color:var(--ink2)}
.fbtn:hover{background:#F7FBFB}
.avatar{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:600;font-family:var(--d);background:var(--teal-soft);color:var(--teal)}
.avatar.lg{width:36px;height:36px;font-size:13.5px}
.tl{display:grid;gap:0}
.tl-item{position:relative;padding:9px 0 11px 22px;border-left:1px solid var(--line)}
.tl-item::before{content:"";position:absolute;left:-4.5px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--teal);border:2px solid #fff}
.tl-item.pos::before{background:var(--green)}
.tl-item.neg::before{background:var(--rust)}
.tl-item.none::before{background:var(--ink3)}
.tl-item:first-child{border-left-color:transparent}
.tl-body b{font-size:12.5px}
.tl-meta{font-size:11px;color:var(--ink3);margin:2px 0 4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tl-sum{font-size:12.5px;color:var(--ink);line-height:1.5}
.tl-next{font-size:11.5px;color:var(--teal);margin-top:4px;display:flex;gap:5px;align-items:flex-start}
.chipx{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 6px;background:#F2F6F6;border-radius:3px;color:var(--ink2)}
.hr{height:1px;background:var(--line2);margin:12px 0}
.grow{flex:1;min-width:0}
.sel{height:32px;max-width:100%;border:1px solid var(--line);border-radius:var(--rs);padding:0 6px;background:#fff;font-size:12.5px;color:var(--ink2)}
@media(max-width:767px){.sel{height:40px;font-size:16px}}
.crumb{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink3);margin-bottom:8px}
.crumb:hover{color:var(--teal)}
.hero{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
@media(min-width:768px){.hero{flex-wrap:nowrap;align-items:center}}
.hero .grow{flex:1;min-width:180px}
.hero h1{font-size:19px;line-height:1.25}
@media(min-width:768px){.hero h1{font-size:24px}}
.hero .hmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:7px;font-size:12px;color:var(--ink3)}
.ref{font-family:var(--m);font-size:11.5px;letter-spacing:.05em;color:var(--ink3)}
.lnk{color:var(--teal);text-decoration:none;cursor:pointer}
.lnk:hover{text-decoration:underline}
.sticky-cta{display:none}
@media(max-width:767px){
  .sticky-cta{position:fixed;right:14px;bottom:16px;z-index:50;display:flex;box-shadow:0 10px 26px -8px rgba(7,67,64,.5);border-radius:999px;height:48px;padding:0 18px}
  .view{padding-bottom:92px}
}
.wait{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink2);background:#F2F6F6;border-radius:3px;padding:1px 6px}
.wait b{font-weight:600;color:var(--ink)}

/* ===== 11. SERVICE COMPONENTS ===== */
.board{display:grid;grid-template-columns:repeat(6,minmax(186px,1fr));gap:9px;overflow-x:auto;padding:2px 2px 8px}
.bcol{background:#fff;border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:130px;overflow:hidden}
.bcol-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-bottom:1px solid var(--line2);background:#FBFDFD;flex:none}
.bcol-h b{font-size:12px;font-family:var(--d);font-weight:600}
.bcol-h span{font-family:var(--m);font-size:11px;color:var(--ink3)}
.bcol-b{padding:8px;display:grid;gap:7px;align-content:start}
.bcard{border:1px solid var(--line2);border-left:3px solid var(--line);border-radius:4px;padding:8px 9px;background:#FCFDFD;cursor:pointer;min-height:44px}
.bcard:hover{background:#F4FAF9;border-color:#C9DCDC}
.bcard:focus-visible{outline:2px solid var(--teal);outline-offset:-1px}
.bcard .r{font-family:var(--m);font-size:10.5px;color:var(--ink3);display:flex;justify-content:space-between;gap:6px}
.bcard .t{font-size:12.5px;font-weight:600;line-height:1.35;margin:3px 0 2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bcard .m{font-size:11px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard.p1{border-left-color:var(--rust)}
.bcard.p2{border-left-color:#C08A22}
.bcard.p3{border-left-color:#9EBDB8}
@media(max-width:900px){.board{grid-template-columns:1fr;overflow:visible}.bcol{min-height:0}}
.steps{display:grid;gap:0;margin:4px 0 2px}

<script>
/* ============================================================
   SOLARWATT SERVICE PORTAL — single file, local storage
   Cases + warranty, installer enquiries, SLA tracking, reports.
   ============================================================ */

const LS = 'solarwatt.service.v1';
const DB = {
  settings:{
    currency:'AUD',
    sla:{ P1:[4,48], P2:[8,120], P3:[24,336] },
    team:['Ana Duarte','Marcus Reid','Priya Raman','Tobias Lang','Sam Okafor'],
    sample:false, seqC:148, seqE:30
  },
  installers:[], cases:[], enquiries:[], docs:[]
};

/* ---------- storage ---------- */
function save(){
  takeSnapshot();
  try{ localStorage.setItem(LS, JSON.stringify(DB)); scheduleBackup(); }
  catch(err){ toast('Could not save — browser storage is blocked or full. Use Export in Data.'); }
}
function load(){
  let raw=null;
  try{ raw = localStorage.getItem(LS); }catch(err){ raw=null; }
  if(!raw) return false;
  try{
    const p = JSON.parse(raw);
    if(p && Array.isArray(p.cases)){
      DB.settings = Object.assign(DB.settings, p.settings||{});
      DB.settings.sla = Object.assign(DB.settings.sla||{}, (p.settings&&p.settings.sla)||{});
      DB.installers = p.installers||[];
      DB.companies = p.companies||[];
      DB.cases = p.cases||[];
      DB.enquiries = p.enquiries||[];
      DB.docs = p.docs||[];
      normalizeDB();
      return true;
    }
  }catch(err){ console.warn('stored data unreadable', err); }
  return false;
}
/* fills in anything an older or hand-edited file might be missing, so a view never trips on it */
function normalizeDB(){
  const s=DB.settings=DB.settings||{};
  s.currency=s.currency||'AUD';
  const slaDef={P1:[4,48],P2:[8,120],P3:[24,336]};
  s.sla=Object.assign({}, slaDef, s.sla||{});
  ['P1','P2','P3'].forEach(p=>{
    const v=s.sla[p];
    s.sla[p]=Array.isArray(v)? [Number(v[0])||slaDef[p][0], Number(v[1])||slaDef[p][1]] : slaDef[p].slice();
  });
  s.team=Array.isArray(s.team)? s.team.filter(Boolean):[];
  s.seqC=Number(s.seqC)||0;
  s.seqE=Number(s.seqE)||0;
  DB.installers=(Array.isArray(DB.installers)? DB.installers:[]).map(i=>{
    i=Object.assign({company:'Unnamed installer',tier:'Authorised installer',city:'',state:'',country:'',
      contact:'',role:'',phone:'',email:'',first:'',last:'',accredited:'No',trainedAt:''}, i);
    if(!i.first && !i.last && i.contact){
      const parts=String(i.contact).trim().split(/\s+/);
      i.first=parts.shift()||'';
      i.last=parts.join(' ');
    }
    i.contact=[i.first,i.last].filter(Boolean).join(' ') || i.contact || '';
    if(['Yes','No','Pending'].indexOf(i.accredited)<0) i.accredited='No';
    i.trainedAt=i.trainedAt||'';
    i.companyId=i.companyId||'';
    i.contractTo=i.contractTo||'';
    return i;
  });
  DB.companies=(Array.isArray(DB.companies)? DB.companies:[]).map(c=>Object.assign(
    {id:'',name:'',tier:'Authorised installer',city:'',state:'',country:'',phone:'',email:'',notes:''}, c))
    .filter(c=>c.id&&c.name);
  DB.installers.forEach(i=>{
    let c=i.companyId? DB.companies.filter(x=>x.id===i.companyId)[0] : null;
    if(!c) c=ensureCompany(i.company, i);
    if(!c){ i.companyId=''; return; }
    i.companyId=c.id;
    i.company=c.name;
  });
  DB.installers.forEach(i=>{ if(i.contractTo && !DB.companies.some(x=>x.id===i.contractTo)) i.contractTo=''; });
  DB.enquiries=(Array.isArray(DB.enquiries)? DB.enquiries:[]).map(e=>{
    e=Object.assign({}, e);
    e.question=e.question||'';
    e.answer=e.answer||'';
    e.contact=e.contact||'';
    e.channel=e.channel||'Phone';
    e.topic=e.topic||'Other';
    e.mins=Number(e.mins)||0;
    e.status=ENQ_STATUS.indexOf(e.status)>-1? e.status:'Open';
    e.at=Number(e.at)||Date.now();
    e.installerId=e.installerId||'';
    e.caseId=e.caseId||'';
    return e;
  });
  DB.docs=(Array.isArray(DB.docs)? DB.docs:[]).map(d=>Object.assign(

/* ---------- backup: snapshots + folder autosave ---------- */
const SNAP_KEY='solarwatt.service.snapshots';
const BK_KEY='solarwatt.service.backupmeta';
const SNAP_MAX=12;
const SNAP_GAP=90000;
const BK_DEBOUNCE=7000;
let lastSnapAt=0, bkTimer=null, dirHandle=null;
const hasFS = typeof window!=='undefined' && typeof window.showDirectoryPicker==='function';

function bkMeta(){ try{ return JSON.parse(localStorage.getItem(BK_KEY)||'{}')||{}; }catch(e){ return {}; } }
function setBkMeta(patch){
  try{ localStorage.setItem(BK_KEY, JSON.stringify(Object.assign({}, bkMeta(), patch))); }catch(e){}
}
function snaps(){ try{ const a=JSON.parse(localStorage.getItem(SNAP_KEY)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function stroke(ts){
  if(!ts) return 'never';
  const s=Math.max(0, Math.round((Date.now()-ts)/1000));
  if(s<60) return 'just now';
  if(s<3600) return Math.round(s/60)+' min ago';
  if(s<86400) return Math.round(s/3600)+' h ago';
  return Math.round(s/86400)+(s<172800?' day ago':' days ago');
}
function fmtWhen(ts){
  const d=new Date(ts);
  return pad(d.getDate())+' '+MON[d.getMonth()]+', '+pad(d.getHours())+':'+pad(d.getMinutes());
}
function takeSnapshot(reason){
  let body;
  try{ body=JSON.stringify(DB); }catch(e){ return false; }
  const manual = reason==='manual';
  const list=snaps();
  if(!manual && list.length && list[0].body===body) return false;
  const now=Date.now();
  if(!manual && list.length && now-lastSnapAt<SNAP_GAP) return false;
  list.unshift({at:now, why:manual?'manual':'auto', body:body,
    n:{c:DB.cases.length, e:DB.enquiries.length, i:DB.installers.length}});
  while(list.length>SNAP_MAX) list.pop();
  lastSnapAt=now;
  try{ localStorage.setItem(SNAP_KEY, JSON.stringify(list)); return true; }
  catch(err){
    try{ localStorage.setItem(SNAP_KEY, JSON.stringify(list.slice(0,3))); }catch(e2){}
    return false;
  }
}
const IDB_NAME='solarwatt-service-fs', IDB_STORE='handles', IDB_DOCS='docs';
function idbOpen(){
  return new Promise((res,rej)=>{
    if(typeof indexedDB==='undefined') return rej(new Error('no-indexeddb'));
    let r;
    try{ r=indexedDB.open(IDB_NAME,2); }catch(e){ return rej(e); }
    r.onupgradeneeded=()=>{
      const db=r.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      if(!db.objectStoreNames.contains(IDB_DOCS)) db.createObjectStore(IDB_DOCS);
    };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error||new Error('idb'));
  });
}
function idbGet(k, store){
  return idbOpen().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(store||IDB_STORE,'readonly'); const g=tx.objectStore(store||IDB_STORE).get(k);
    g.onsuccess=()=>res(g.result||null); g.onerror=()=>rej(g.error);
  }));
}
function idbPut(k,v, store){
  return idbOpen().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(store||IDB_STORE,'readwrite'); tx.objectStore(store||IDB_STORE).put(v,k);
    tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error);
  }));
}
function idbDel(k, store){
  return idbOpen().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(store||IDB_STORE,'readwrite'); tx.objectStore(store||IDB_STORE).delete(k);
    tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error);
  }));
}
async function ensureDir(promptNow){
  if(dirHandle) return dirHandle;
  if(!hasFS) return null;
  try{
    const h=await idbGet('dir');
    if(!h) return null;
    const p = promptNow ? await h.requestPermission({mode:'readwrite'}) : await h.queryPermission({mode:'readwrite'});
    if(p!=='granted'){ setBkMeta({pending:true, dirName:h.name}); return null; }
    dirHandle=h; setBkMeta({pending:false, dirName:h.name});
    return h;
  }catch(e){ return null; }
}
async function writeBackup(manual){
  const h=await ensureDir(!!manual);
  if(!h){
    if(manual) toast(hasFS ? 'Choose a backup folder first.' : 'Folder backups need Chrome or Edge.');
    return false;
  }
  let payload;
  try{ payload=JSON.stringify({exported:new Date().toISOString(), app:'SOLARWATT Service Portal', auto:true, data:DB}); }
  catch(e){ return false; }
  const write=async(name)=>{
    const f=await h.getFileHandle(name,{create:true});
    const w=await f.createWritable();
    await w.write(payload); await w.close();
  };
  try{
    await write('solarwatt-service-'+todayISO()+'.json');
    await write('latest.json');
    setBkMeta({lastAt:Date.now(), dirName:h.name, pending:false});
    if(manual) toast('Saved to '+h.name);
    return true;
  }catch(err){
    if(manual) toast('Backup failed: '+((err&&err.message)||'write error'));
    return false;
  }
}
async function pickFolder(){
  if(!hasFS){ toast('Folder backups need Chrome or Edge. Snapshots still work.'); return; }
  try{
    const h=await window.showDirectoryPicker({id:'solarwatt-service-backup', mode:'readwrite'});
    dirHandle=h;
    try{ await idbPut('dir',h); }catch(e){}
    setBkMeta({dirName:h.name, pending:false});
    await writeBackup(true);
    render();
  }catch(err){
    if(!(err&&err.name==='AbortError')) toast('Could not open that folder.');
  }
}
async function reconnectFolder(){
  await ensureDir(true);
  if(dirHandle){ await writeBackup(true); render(); }
  else toast('Folder access was not granted.');
}
function scheduleBackup(){
  const m=bkMeta();
  if(!hasFS || !m.dirName || m.pending) return;
  clearTimeout(bkTimer);
  bkTimer=setTimeout(()=>{
    writeBackup(false).then(ok=>{ if(ok && currentRoute()==='data') render(); });
  }, BK_DEBOUNCE);
}
function applyRestore(obj,label){
  const d=(obj && obj.data) ? obj.data : obj;
  if(!d || !Array.isArray(d.cases)){ toast('That backup is not readable.'); return false; }
  takeSnapshot('manual');
  DB.cases=d.cases||[]; DB.enquiries=d.enquiries||[];
  DB.installers=d.installers||[];
  DB.companies=d.companies||[];
  DB.docs=d.docs||[];
  DB.settings=Object.assign(DB.settings, d.settings||{});
  DB.settings.sla=Object.assign(DB.settings.sla||{}, (d.settings&&d.settings.sla)||{});
  normalizeDB();
  save(); render();
  toast(label||'Restored');
  return true;
}
function restoreSnap(i){
  const list=snaps(); const s=list[Number(i)];
  if(!s) return;
  let parsed;
  try{ parsed=JSON.parse(s.body); }catch(e){ toast('That snapshot is damaged.'); return; }
  if(!confirm('Restore the snapshot from '+fmtWhen(s.at)+'?\n\nThe data you have now is saved as a snapshot first, so you can undo this.')) return;
  applyRestore(parsed,'Restored to '+fmtWhen(s.at));
}
async function restoreLatest(){
  const h=await ensureDir(true);
  if(!h){ toast('Choose the backup folder first.'); return; }
  try{
    const f=await h.getFileHandle('latest.json');
    const text=await (await f.getFile()).text();
    const parsed=JSON.parse(text);
    if(!confirm('Restore the newest file in '+h.name+'?\n\nYour current data is snapshotted first, so this can be undone.')) return;
    applyRestore(parsed,'Restored from '+h.name);
  }catch(err){ toast('No latest.json in that folder yet.'); }
}
async function initBackup(){
  if(!hasFS) return;
  try{
    const h=await idbGet('dir');
    if(!h) return;
    const p=await h.queryPermission({mode:'readwrite'});
    if(p==='granted'){ dirHandle=h; setBkMeta({dirName:h.name, pending:false}); }
    else setBkMeta({dirName:h.name, pending:true});
    if(currentRoute()==='data') render();
  }catch(e){}
}

function parseISO(iso){ if(!iso) return null; const [y,m,d]=String(iso).split('-').map(Number); return new Date(y,(m-1),d,12); }
function isoToTs(iso,hh){ const d=parseISO(iso); if(!d||isNaN(d.getTime())) return 0; d.setHours(hh==null?9:hh,0,0,0); return d.getTime(); }
function isoShiftYears(ts,y){ const d=new Date(ts); d.setFullYear(d.getFullYear()-y); return isoOfTs(d.getTime()); }
function isoAddYears(iso,y){ const d=parseISO(iso); if(!d) return ''; d.setFullYear(d.getFullYear()+y); return isoOfTs(d.getTime()); }
function daysBetweenISO(a,b){
  const A=parseISO(a), B=parseISO(b);
  if(!A||!B) return null;
  return Math.round((B.getTime()-A.getTime())/86400000);
}

function fmtDT(ts){
  if(!ts) return '—';

function fmtISO(iso){ const d=parseISO(iso); return d? d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear() : '—'; }
function ageText(ms){
  if(ms==null) return '—';
  const h=Math.abs(ms)/3600000;
  if(h<1) return Math.max(1,Math.round(h*60))+'m';
  if(h<24) return Math.round(h)+'h';
  const d=h/24;
  return (d<10? (Math.round(d*10)/10) : Math.round(d))+'d';
}

function money(n){

function moneyShort(n){
  const v=Math.round(Number(n)||0), a=Math.abs(v);
  const syms={AUD:'A$',USD:'$',EUR:'\u20ac',GBP:'\u00a3',NZD:'NZ$',CNY:'\u00a5'};

function kbAlarm(code){
  const s=String(code||'').trim().toLowerCase();
  if(!s) return null;
  return KB_ALARMS.find(a=>a[0].toLowerCase()===s) ||
    (s.length>=6? KB_ALARMS.find(a=>a[0].toLowerCase().indexOf(s)>-1) : null);
}
function copyPlainText(text, okMsg){
  const done=()=>toast(okMsg||'Copied — ready to paste');
  const fallback=()=>{
    const ta=document.createElement('textarea');
    ta.value=text; ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    let ok=false;
    try{ ok=document.execCommand('copy'); }catch(err){}
    ta.remove();
    if(ok) done(); else toast('Could not copy automatically — select the text and copy it manually.');
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else fallback();
}
function diagramPng(svg){
  return new Promise((resolve,reject)=>{
    const clone=svg.cloneNode(true);
    clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
    clone.setAttribute('width','960');
    clone.setAttribute('height','540');
    const xml=new XMLSerializer().serializeToString(clone);
    const blob=new Blob([xml],{type:'image/svg+xml;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const img=new Image();
    img.onload=()=>{
      try{
        const c=document.createElement('canvas');
        c.width=1920; c.height=1080;
        const ctx=c.getContext('2d');
        if(!ctx) throw new Error('Canvas unavailable');
        ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,c.width,c.height);
        ctx.drawImage(img,0,0,c.width,c.height);
        URL.revokeObjectURL(url);
        c.toBlob(png=>png?resolve(png):reject(new Error('PNG encode failed')),'image/png');
      }catch(err){ URL.revokeObjectURL(url); reject(err); }
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('SVG render failed')); };
    img.src=url;
  });
}
function saveDiagramBlob(blob, rec){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='solarwatt-'+rec.id+'.png';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1200);
}
async function copyDiagramImage(id){
  const rec=KB_DIAGRAMS.find(d=>d.id===id);
  const svg=document.querySelector('[data-diagram="'+id+'"] svg');
  if(!rec || !svg){ toast('That diagram is not on screen — open the Diagrams tab and try again.'); return; }
  let png;
  try{ png=await diagramPng(svg); }catch(err){ toast('Could not render that diagram. Use Download PNG instead.'); return; }
  if(navigator.clipboard && navigator.clipboard.write && typeof ClipboardItem!=='undefined'){
    try{
      await navigator.clipboard.write([new ClipboardItem({'image/png':png})]);
      toast('PNG copied — paste into WhatsApp or a message');
      return;
    }catch(err){}
  }
  saveDiagramBlob(png, rec);
  toast('PNG downloaded — attach it to the message');
}
async function downloadDiagramImage(id){
  const rec=KB_DIAGRAMS.find(d=>d.id===id);
  const svg=document.querySelector('[data-diagram="'+id+'"] svg');
  if(!rec || !svg){ toast('That diagram is not on screen — open the Diagrams tab and try again.'); return; }
  try{ saveDiagramBlob(await diagramPng(svg), rec); toast('PNG downloaded'); }
  catch(err){ toast('Could not render that diagram — try again from the Diagrams tab.'); }
}

  const steps=String(a[3]||'').split('. ').map(s=>s.trim()).filter(Boolean);
  steps.forEach((s,i)=>lines.push((i+1)+'. '+s.replace(/\.?$/,'.')));
  lines.push('', 'Record the reading or result at each step, and photograph the display before clearing the alarm.');
  return lines.join('\n');
}
function playbookCopyText(b){
  const lines=['SOLARWATT AU service — troubleshooting steps','',
    'Issue: '+b.title, 'Applies to: '+kbFamLabel(b.fam), '',
    'What the installer reports:', b.symptom, '',
    'Please work through these checks in order:'];
  b.checks.forEach((s,i)=>lines.push((i+1)+'. '+s));
  lines.push('', 'Note the reading or result at each step, and send photos of the label and error screen.', '',
    'Stop point:', b.stop, '', 'If it needs escalation, send:', b.escalate);
  return lines.join('\n');
}

function seedDocs(){

  if(s.docsSeeded) return;
  DB.docs=Array.isArray(DB.docs)? DB.docs:[];
  KB_DOC_SEED.forEach((d,i)=>{
    if(DB.docs.some(x=>x.file===d.file)) return;

  });
  s.docsSeeded=true;

function kbProduct(id){ return KB_PRODUCTS.find(p=>p.id===id)||null; }
function kbPlaybook(id){ return KB_PLAYBOOKS.find(p=>p.id===id)||null; }
function kbFamForCase(c){
  const sys=c.system||{};
  const p=kbProductForModel(sys.model);
  if(p) return kbFamForProduct(p);
  const t=(sys.type||'').toLowerCase(), m=(sys.model||'');
  if(t==='battery'||/b10|battery/i.test(m)) return 'bat';
  if(t==='commercial pcs'||/c30|three|3-phase/i.test(m)) return 'three';
  if(t==='hybrid inverter'||t==='string inverter'||/h10|h5|one|inverter/i.test(m)) return 'one';
  return 'any';
}
function kbFamForProduct(p){
  if(!p) return '';
  return p.id==='bat21'? 'bat' : p.id==='visone'? 'one' : p.id==='visthree'? 'three' : '';
}
function sysHasBattery(sys){
  sys=sys||{};
  const p=kbProductForModel(sys.model);
  if(p && p.id==='bat21') return true;
  if(sys.setup==='bat'||sys.setup==='inv_bat') return true;
  if(sys.setup==='inv') return false;
  if(sys.battModel) return true;
  return String(sys.type||'').toLowerCase()==='battery';
}
function systemSetup(sys){
  sys=sys||{};
  const p=kbProductForModel(sys.model);
  if(p && p.id==='bat21') return 'bat';
  if(sys.setup==='bat'||sys.setup==='inv_bat') return 'bat';
  if(sys.setup==='inv') return 'inv';
  return (sys.battModel||sysHasBattery(sys))? 'bat':'inv';
}
function systemBattModel(sys){
  sys=sys||{};
  const p=kbProductForModel(sys.model);
  if(p && p.id==='bat21') return sys.model;
  return sys.battModel || 'vision two 2.1';
}
function kbKwhNum(m){
  const n=parseFloat(kbCapacityForModel(m));
  return isFinite(n)? n : 0;
}
function systemBattKwh(sys){
  if(systemSetup(sys)!=='bat') return 0;
  return kbKwhNum(systemBattModel(sys));
}
function systemSetupLabel(sys){
  const setup=systemSetup(sys);
  const p=kbProductForModel((sys||{}).model);
  if(p && p.id==='bat21'){
    const k=kbKwhNum(sys.model);
    return 'Battery only · '+sys.model+(k? ' · '+k.toFixed(2)+' kWh':'');
  }
  if(setup!=='bat') return 'Inverter only — no battery';
  const bm=systemBattModel(sys), k=kbKwhNum(bm);
  return 'Inverter + '+bm+(k? ' · '+k.toFixed(2)+' kWh':'');
}
function battVariantOptions(sel){
  const p=kbProduct('bat21');
  return p.variants.rows.map(r=>'<option value="'+esc(r[0])+'"'+(String(sel)===r[0]?' selected':'')+'>'+esc(r[0])+' · '+esc(r[1])+'</option>').join('');
}
function setupOptions(sel){
  return '<option value="inv"'+(sel!=='bat'?' selected':'')+'>Inverter only — no battery on site</option>'+
    '<option value="bat"'+(sel==='bat'?' selected':'')+'>Inverter + battery storage (vision 2.1 stack)</option>';
}
const PB_NEEDS_BATTERY=['pb_bat','pb_soc','pb_backup','pb_batteryled'];
function pbFitsConfig(pb,fam,hasBat){
  if(!pb) return false;
  if(PB_NEEDS_BATTERY.indexOf(pb.id)>-1 && !hasBat) return false;
  if(pb.fam==='any') return true;
  if(pb.fam==='bat') return !!hasBat;
  if(pb.fam==='one'||pb.fam==='three') return fam===pb.fam;
  return false;
}
function kbForCase(c){
  const fam=kbFamForCase(c), cat=(c.fault&&c.fault.category)||'', hasBat=sysHasBattery(c.system);
  return KB_PLAYBOOKS.filter(p=>p.cats.indexOf(cat)>-1 && pbFitsConfig(p,fam,hasBat)).slice(0,3);
}
function kbForTopic(topic){
  return KB_PLAYBOOKS.filter(p=>p.topics.indexOf(topic)>-1).slice(0,2);
}
function kbProductForCase(c){
  const fam=kbFamForCase(c);
  return fam==='bat'? kbProduct('bat21') : fam==='three'? kbProduct('visthree') : fam==='one'? kbProduct('visone') : null;
}
function kbKnownModel(m){
  const s=String(m||'').trim().toLowerCase();
  if(!s) return true;
  return KB_PRODUCTS.some(p=>p.variants.rows.some(r=>r[0].toLowerCase()===s));
}
function kbProductForModel(model){
  const s=String(model||'').trim().toLowerCase();
  if(!s) return null;
  for(let n=0;n<KB_PRODUCTS.length;n++){
    const p=KB_PRODUCTS[n];
    if(p.variants.rows.some(r=>String(r[0]).toLowerCase()===s)) return p;
  }
  return null;
}
function kbCapacityForModel(model){
  const p=kbProductForModel(model);
  if(!p) return '';
  const row=p.variants.rows.find(r=>String(r[0]).toLowerCase()===String(model).trim().toLowerCase());
  return row? String(row[1]||'') : '';
}

function warrantyOf(c){
  const we=c.system&&c.system.warrantyEnd;
  if(!we) return {k:'idle', t:'Warranty unknown', charge:false, days:null};
  const days=daysBetweenISO(todayISO(), we);
  if(days==null) return {k:'idle', t:'Warranty unknown', charge:false, days:null};
  if(days<0) return {k:'risk', t:'Out of warranty', charge:true, days:days};
  if(days<=120) return {k:'watch', t:'Ends in '+days+'d', charge:false, days:days};
  const yr=Math.round(days/3650*10)/10;
  return {k:'good', t:'In warranty · '+yr+' yr left', charge:false, days:days};
}
function warrantyBadge(c){
  const w=warrantyOf(c);
  return '<span class="badge b-'+w.k+'"><i></i>'+esc(w.t)+'</span>';
}
function slaCfg(p){
  const s=(DB.settings.sla&&DB.settings.sla[p])||[24,336];
  return { resp:Number(s[0])||24, res:Number(s[1])||336 };
}
function slaState(c){
  const cfg=slaCfg(c.priority);
  const respDue=c.openedAt+cfg.resp*3600000;
  const resDue=c.openedAt+cfg.res*3600000;
  const done=(c.stage==='Resolved'||c.stage==='Closed');
  const now=Date.now();
  const respOK = c.firstResponseAt ? (c.firstResponseAt<=respDue) : null;
  const resAt = c.resolvedAt || (done ? (c.updatedAt||c.openedAt) : 0);
  const resOK = resAt ? (resAt<=resDue) : null;
  const left=(resDue-now)/3600000;
  let k,t;
  if(resOK===false || respOK===false){ k='risk'; t='SLA breached'; }
  else if(done && resOK!==false && respOK!==false){ k='good'; t='SLA met'; }
  else if(!done && respOK===null && now>respDue){ k='risk'; t='No first response'; }
  else if(!done && left < cfg.res*0.25){ k='watch'; t='SLA at risk'; }
  else { k='blue'; t='On track'; }
  return {k,t,respDue,resDue,left,respOK,resOK,cfg,done,respOverdue:(!c.firstResponseAt && now>respDue)};
}
function slaBadge(c){
  const s=slaState(c);
  return '<span class="badge b-'+s.k+'"><i></i>'+esc(s.t)+'</span>';
}
function dueText(c){
  const s=slaState(c);
  if(s.resOK===false) return '<span style="color:var(--rust)">'+ageText(s.resDue-c.resolvedAt)+' over</span>';
  if(s.done) return '<span style="color:var(--ink3)">'+ageText((c.resolvedAt||c.updatedAt)-c.openedAt)+' to close</span>';
  if(s.left<0) return '<span style="color:var(--rust)">'+ageText(s.left*3600000)+' over</span>';
  return '<span style="color:'+(s.k==='watch'?'var(--amber)':'var(--ink2)')+'">'+ageText(s.left*3600000)+' left</span>';
}
function waitChip(w){
  if(!w) return '';
  const cls = w==='Service team'?'b-teal' : w==='Installer'?'b-watch' : w==='Customer'?'b-blue' : w==='Carrier'?'b-violet':'b-idle';
  return '<span class="badge '+cls+'"><i></i>On '+esc(w)+'</span>';
}

function loggedAction(c,type,by,text,at){
  c.actions=c.actions||[];

function byId2(list,id){ return list.find(x=>x.id===id); }

function seedCase(o,I,n){
  const ins=I.find(x=>x.id===o.i)||I[0];
  const openedAt=hAgo(o.h);
  const ref='SW-SR-'+pad4(148-n);
  const idx=STAGE_IDX[o.st];
  const owner=o.o||'';
  const firstAt=openedAt+2*3600000;
  const comm=isoShiftYears(openedAt, 2+(n%4));
  const we=o.we||isoAddYears(comm,10);
  const rma=o.part? { no:'RMA-'+pad4(3020+n*7), part:o.part, carrier:'TNT', tracking:'TN'+(771000+n*13),
    raised:openedAt+24*3600000, shipped: idx>=STAGE_IDX['Field work'] ? openedAt+56*3600000 : 0 } : null;
  let resolvedAt=0, closedAt=0;
  if(idx>=STAGE_IDX['Resolved']) resolvedAt=openedAt+(o.res||36)*3600000;
  if(o.st==='Closed') closedAt=resolvedAt+48*3600000;
  const acts=[];
  acts.push({at:openedAt, type:'Intake', by:ins.contact+' · '+ins.company,
    text:'Case logged by '+ins.company+' via '+o.src+'. '+(o.d||'')});
  if(idx>=STAGE_IDX['Triage']){
    acts.push({at:firstAt, type:'Triage', by:owner||'Service desk',
      text:'Triaged at '+o.p+', assigned to '+(owner||'the service queue')+'. Remote diagnostics requested.'});
  }
  if(idx>=STAGE_IDX['Awaiting info']){
    const waitTxt = o.wait==='Customer' ? 'Asked the customer for access and a recording of the fault.'
      : o.wait==='Installer' ? 'Asked the installer for site photos, a serial label photo and a full error log.'
      : 'Waiting on the site to come back online before the next remote session.';
    acts.push({at:openedAt+Math.min((o.h-1)*3600000, (2+10)*3600000), type:'Note', by:owner||'Service desk', text:waitTxt});
  }
  if(rma && idx>=STAGE_IDX['Parts / RMA']){
    acts.push({at:rma.raised, type:'Parts', by:'Ana Duarte',
      text:'RMA '+rma.no+' raised for '+rma.part+'. Dispatch booked with '+rma.carrier+'.'});
  }
  if(idx>=STAGE_IDX['Field work']){
    acts.push({at:openedAt+Math.min((o.h-1)*3600000, 72*3600000), type:'Site visit', by:owner||'Field technician',
      text:'Site visit attended. System isolated, fault reproduced and photographed for the case file.'});
  }
  if(resolvedAt) acts.push({at:resolvedAt, type:'Fix', by:owner||'Field technician',
    text:(o.fix||'Fault cleared and the system returned to normal operation.')});
  if(closedAt) acts.push({at:closedAt, type:'Closed', by:'Service desk',
    text:'Case closed after a follow-up call confirmed no recurrence.'});

  const actions=acts.filter(a=>a.at<=Date.now()).sort((a,b)=>a.at-b.at);
  const updatedAt=actions.length? actions[actions.length-1].at : openedAt;

  return {
    id:'c_'+(n+1), ref:ref, title:o.t, kind:o.k, priority:o.p, stage:o.st,
    openedAt:openedAt, updatedAt:updatedAt,
    firstResponseAt: idx>=STAGE_IDX['Triage'] ? firstAt : 0,
    resolvedAt:resolvedAt, closedAt:closedAt,
    installerId:o.i, contact:ins.contact, endUser:o.u||'',
    site:{addr:'', city:ins.city, state:ins.state},
    system:{type:o.sys, model:o.m, serial:(o.m||'SW').replace(/[^A-Za-z0-9]/g,'').slice(0,5).toUpperCase()+'-'+(2400+n*11)+'-'+(800+n), capacity:o.cap, commissioned:comm, warrantyEnd:we},
    fault:{category:o.cat, code:o.code||'', description:o.d||''},
    owner:owner, source:o.src||'Installer portal',
    waiting: o.wait || (o.part? 'Carrier' : 'Service team'),
    actions:actions, rma:rma,
    resolution:{ cause:o.cause||'', fix:o.fix||'', hours: resolvedAt? Math.round((resolvedAt-openedAt)/3600000) : 0, cost: o.cost||0 },
    enquiryId:''
  };
}

/* ---------- modal + draft ---------- */
let modalOpen=false, modalSig=null, modalDirty=false, draftTimer=null;
const DRAFT_KEY='solarwatt.service.draft';
const DRAFT_TTL=12*3600*1000;

function sigOf(html){
  const h=String(html||'');
  const k=(/\sdata-form="([a-z]+)"/.exec(h)||[])[1];
  if(!k) return null;
  const id=(/\sdata-id="([^"]*)"/.exec(h)||[])[1]||'new';
  return k+'|'+id;
}
function modalForm(){ return document.querySelector('#modal-root .modal form[data-form]'); }
function readDraft(){
  try{
    const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');
    if(!d||!d.sig||!d.values) return null;
    if(Date.now()-(d.at||0)>DRAFT_TTL) return null;
    return d;
  }catch(e){ return null; }
}
function writeDraft(){
  const f=modalForm();
  if(!modalOpen||!modalSig||!f) return;
  const vals={};
  try{
    const fd=new FormData(f);
    for(const pair of fd.entries()){
      const k=pair[0];
      if(k in vals){ vals[k]=(Array.isArray(vals[k])? vals[k] : [vals[k]]).concat([pair[1]]); }
      else vals[k]=pair[1];
    }
  }catch(e){ return; }
  try{ localStorage.setItem(DRAFT_KEY, JSON.stringify({sig:modalSig, at:Date.now(), values:vals})); }catch(e){}
}
function queueDraft(){
  if(!modalOpen||!modalSig) return;
  modalDirty=true;
  clearTimeout(draftTimer);
  draftTimer=setTimeout(writeDraft, 350);
}
function hasUnsaved(){ return !!(modalOpen && modalSig && modalDirty); }
function clearDraft(){
  clearTimeout(draftTimer);
  modalDirty=false;
  try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
}
function restoreDraft(){
  const d=readDraft();
  if(!d||d.sig!==modalSig) return false;
  const f=modalForm();
  if(!f) return false;
  Object.keys(d.values||{}).forEach(k=>{
    const els=$$('[name="'+k+'"]', f);
    if(!els.length) return;
    const vals=Array.isArray(d.values[k])? d.values[k] : [d.values[k]];
    if(els[0].type==='checkbox'||els[0].type==='radio'){
      els.forEach(el=>{ el.checked = vals.indexOf(el.value)>-1; });
    } else {
      try{ els[0].value=vals[0]; }catch(e){}
    }
  });
  modalDirty=true;
  toast('Restored what you had typed');
  return true;
}
function modal(title, bodyHTML, opts){
  opts=opts||{};
  const root=$('#modal-root');
  root.innerHTML=
    '<div class="modal-back" data-backdrop="1">'+
      '<div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'">'+
        '<div class="m-head"><h2>'+esc(title)+'</h2>'+
          '<button class="btn btn-g btn-ico" data-act="closeModal" aria-label="Close">'+
            '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.9"></path></svg>'+
          '</button>'+
        '</div>'+
        '<div class="m-body">'+bodyHTML+'</div>'+
      '</div>'+
    '</div>';
  modalOpen=true;
  modalSig=sigOf(bodyHTML);
  modalDirty=false;
  document.body.style.overflow='hidden';
  if(modalSig) setTimeout(restoreDraft, 30);
  const first=root.querySelector('input,select,textarea');
  if(first && opts.focus!==false) setTimeout(()=>first.focus(),60);
}
function closeModal(force){
  if(!modalOpen) return;
  if(!force && hasUnsaved()){
    writeDraft();
    if(!confirm('This entry is not saved yet.\n\nDiscard what you typed?')) return;
  }
  clearDraft();
  $('#modal-root').innerHTML='';
  document.body.style.overflow='';
  modalOpen=false;
  modalSig=null;
}

/* ---------- chart primitives ---------- */
function barChart(buckets){
  const max=Math.max(1, ...buckets.map(b=>Math.max(Number(b.v)||0, Number(b.v2)||0)));
  return '<div class="barchart">'+
    '<span class="ymax">'+max+'</span>'+
    '<div class="bc-cols">'+
      buckets.map((b,i)=>{
        const h1=Math.round((Number(b.v)||0)/max*100);
        const h2=b.v2==null? null : Math.round((Number(b.v2)||0)/max*100);
        const lab=(buckets.length>9 && i%2===1)? '' : b.l;
        return '<div class="bc-col">'+
          '<div class="bc-fw">'+
            '<div class="bc-fill'+((b.v?'':' zero'))+'" style="height:'+h1+'%" title="'+esc((b.full||b.l)+' · opened: '+(b.v||0))+'"></div>'+
            (h2==null? '' : '<div class="bc-fill two'+((b.v2?'':' zero'))+'" style="height:'+h2+'%" title="'+esc((b.full||b.l)+' · resolved: '+(b.v2||0))+'"></div>')+
          '</div>'+
          '<div class="bc-x">'+esc(lab)+'</div>'+
        '</div>';
      }).join('')+
    '</div>'+
  '</div>';
}
function weekBuckets(n){
  const out=[];
  for(let i=n-1;i>=0;i--){
    const endD=new Date(); endD.setHours(12,0,0,0); endD.setDate(endD.getDate()-i*7);
    const startD=new Date(endD); startD.setDate(startD.getDate()-6);
    const s=isoOfTs(startD.getTime()), e=isoOfTs(endD.getTime());
    out.push({l:fmtShort(startD.getTime()), from:s, to:e,
      full:fmtShort(startD.getTime())+' – '+fmtShort(endD.getTime())});
  }
  return out;
}
function hbars(rows){
  const max=Math.max(1, ...rows.map(r=>Number(r.v)||0));
  return '<div class="hbars">'+rows.map(r=>
    '<div class="hbar"><div class="hb-top"><span>'+esc(r.l)+'</span><b>'+esc(r.t||String(r.v))+'</b></div>'+
    '<div class="hb-track"><div class="hb-fill" style="width:'+Math.round((Number(r.v)||0)/max*100)+'%'+(r.c?';background:'+r.c:'')+'"></div></div></div>'
  ).join('')+'</div>';
}
function kpi(lab,val,foot,alert){
  return '<div class="kpi'+(alert?' alert':'')+'"><div class="lab">'+esc(lab)+'</div><div class="val">'+esc(val)+'</div><div class="fo">'+esc(foot)+'</div></div>';

/* ---------- DASHBOARD ---------- */
function dueStrip(){
  const now=Date.now(), end=now+24*3600000;
  const open=openCases();
  const overdue=open.filter(c=>{ const s=slaState(c); return !s.done && s.resDue<now; });
  const soon=open.filter(c=>{ const s=slaState(c); return !s.done && s.resDue>=now && s.resDue<=end; });
  const lanes=['P1','P2','P3'];
  const cols={P1:'var(--rust)',P2:'#C08A22',P3:'var(--teal)'};
  return '<div class="due">'+
    (overdue.length
      ? '<div style="font-size:11.5px;color:var(--rust);margin-bottom:7px">'+overdue.length+' case'+(overdue.length===1?'':'s')+' already past the resolution target</div>'
      : '<div style="font-size:11.5px;color:var(--ink3);margin-bottom:7px">Nothing past its resolution target.</div>')+
    '<div class="due-rail">'+lanes.map(p=>{
      const items=soon.filter(c=>c.priority===p).sort((a,b)=>slaState(a).resDue-slaState(b).resDue);
      return '<div class="due-row"><span class="due-lab">'+p+'</span><div class="due-track">'+
        items.map(c=>{
          const due=slaState(c).resDue;
          const pos=Math.max(1,Math.min(99, (due-now)/(end-now)*100));
          const lab=c.ref+' · '+c.title+' · due '+pad(new Date(due).getHours())+':'+pad(new Date(due).getMinutes());
          return '<span class="due-dot" style="left:'+pos.toFixed(1)+'%;background:'+cols[p]+'" title="'+esc(lab)+'"></span>';
        }).join('')+
      '</div></div>';
    }).join('')+'</div>'+
    '<div class="due-scale"><span>now</span><span>+12h</span><span>+24h</span></div>'+
    '<div style="font-size:11px;color:var(--ink3);margin-top:8px">Resolution target, next 24 hours · '+soon.length+' due</div>'+
  '</div>';
}
function viewDashboard(){
  const open=openCases();
  const breach=open.filter(c=>slaState(c).k==='risk');
  const atRisk=open.filter(c=>slaState(c).k==='watch');
  const p1=open.filter(c=>c.priority==='P1');
  const enq7=DB.enquiries.filter(e=>e.at>=Date.now()-7*86400000);
  const enqOpen=DB.enquiries.filter(e=>e.status==='Open');
  const closed90=DB.cases.filter(c=>c.resolvedAt && c.resolvedAt>=Date.now()-90*86400000);
  const avgD=closed90.length ? closed90.reduce((s,c)=>s+(c.resolvedAt-c.openedAt),0)/closed90.length/86400000 : 0;

  const att=open.filter(c=>{ const s=slaState(c); return s.k==='risk'||s.k==='watch'; })
    .sort((a,b)=> slaState(a).resDue-slaState(b).resDue).slice(0,6);
  const waiting=open.filter(c=>c.waiting && c.waiting!=='Service team')
    .sort((a,b)=>a.openedAt-b.openedAt).slice(0,5);

  const pipe=STAGES.slice(0,6).map(s=>{
    const list=open.filter(c=>c.stage===s);
    return {l:s, v:list.length, t:String(list.length), c:STAGE_HEX[s]};
  });

  const weeks=weekBuckets(8).map(b=>{
    const o=DB.cases.filter(c=>isoOfTs(c.openedAt)>=b.from && isoOfTs(c.openedAt)<=b.to).length;
    const r=DB.cases.filter(c=>c.resolvedAt && isoOfTs(c.resolvedAt)>=b.from && isoOfTs(c.resolvedAt)<=b.to).length;
    return {l:b.l, v:o, v2:r, full:b.full};
  });

  const since=Date.now()-90*86400000;
  const catCount={};
  DB.cases.filter(c=>c.openedAt>=since).forEach(c=>{ const k=c.fault.category||'Other'; catCount[k]=(catCount[k]||0)+1; });

  const feed=[];
  DB.cases.forEach(c=>(c.actions||[]).forEach(a=>{ if(a.at<=Date.now()) feed.push({c:c,a:a}); }));
  feed.sort((x,y)=>y.a.at-x.a.at);
  const recent=feed.slice(0,7);

  const team=DB.settings.team.map(name=>{
    const own=open.filter(c=>c.owner===name);
    return {name:name, n:own.length, br:own.filter(c=>slaState(c).k==='risk').length};
  }).sort((a,b)=>b.br-a.br || b.n-a.n);

  const todayStr=todayD().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});

  return ''+
  '<div class="pg-head"><div><h1>Service desk</h1><p class="sub">'+esc(todayStr)+' · '+open.length+' open cases · '+p1.length+' emergency · '+enqOpen.length+' enquiries to answer</p></div>'+
    '<div class="pg-actions"><button class="btn btn-p" data-act="newCase">New case</button><button class="btn" data-act="newEnquiry">Log enquiry</button><a class="btn" href="#/cases">All cases</a></div></div>'+

  (DB.settings.sample && DB.cases.length? '<div class="notice" style="margin-bottom:12px"><div class="grow"><b>You are looking at sample data.</b> Nine fictional installers, 26 cases and 16 enquiries are loaded so the screens and reports have something to show. Clear them from the Data tab before you start for real.</div><a class="btn btn-sm" href="#/data">Data</a></div>':'')+

  '<div class="kpis">'+
    kpi('Open cases', String(open.length), p1.length+' emergency · '+DB.cases.filter(c=>c.stage==='Intake').length+' not triaged')+
    kpi('SLA breached', String(breach.length), atRisk.length+' more at risk', breach.length>0)+
    kpi('Enquiries (7d)', String(enq7.length), enqOpen.length+' still open')+
    kpi('Avg resolution', closed90.length? (Math.round(avgD*10)/10)+'d' : '—', 'last 90 days · '+closed90.length+' resolved')+
  '</div>'+

  '<div class="g3">'+
    '<div class="stack">'+
      '<div class="card"><div class="card-h"><h2>Case volume</h2><span class="hint">opened vs resolved · 8 weeks</span></div>'+
        '<div class="card-b">'+barChart(weeks)+
          '<div class="legend" style="grid-template-columns:1fr 1fr;display:grid;margin-top:10px">'+
            '<div class="lg"><i style="background:var(--teal)"></i><span>Opened</span><b>'+weeks.reduce((s,b)=>s+b.v,0)+'</b></div>'+
            '<div class="lg"><i style="background:#9EBDB8"></i><span>Resolved</span><b>'+weeks.reduce((s,b)=>s+b.v2,0)+'</b></div>'+
          '</div>'+
        '</div></div>'+

      '<div class="card"><div class="card-h"><h2>Needs attention</h2><span class="hint">by SLA target</span></div>'+
        '<div class="card-b tight">'+(att.length? att.map(caseRow).join('') : emptyBox('All inside target','No case is breaching or close to its SLA.'))+'</div></div>'+

      '<div class="card"><div class="card-h"><h2>Waiting on someone else</h2><span class="hint">'+waiting.length+' shown</span></div>'+
        '<div class="card-b tight">'+(waiting.length? waiting.map(c=>
          '<a class="row" href="#/case/'+c.id+'"><span class="avatar">'+initials(insShort(c.installerId))+'</span>'+
          '<span class="grow"><b>'+esc(c.title)+'</b><span class="meta">'+esc(c.ref)+' · '+esc(c.stage)+' · '+ageText(Date.now()-c.openedAt)+' open</span></span>'+
          waitChip(c.waiting)+'</a>').join('')
          : emptyBox('Nothing with a third party','Every open case is with the service team.'))+'</div></div>'+
    '</div>'+

    '<div class="stack">'+
      '<div class="card"><div class="card-h"><h2>Due next 24 hours</h2><span class="hint">resolution targets</span></div>'+
        '<div class="card-b">'+dueStrip()+'</div></div>'+

      '<div class="card"><div class="card-h"><h2>Pipeline</h2><span class="hint">'+open.length+' open</span></div>'+
        '<div class="card-b">'+hbars(pipe)+'</div></div>'+

      '<div class="card"><div class="card-h"><h2>Fault mix</h2><span class="hint">last 90 days</span></div>'+
        '<div class="card-b">'+(faults.length? hbars(faults) : emptyBox('No cases in range',''))+'</div></div>'+

      '<div class="card"><div class="card-h"><h2>Team load</h2><span class="hint">open / breached</span></div>'+
        '<div class="card-b tight">'+team.map(t=>
          '<div class="row"><span class="avatar">'+initials(t.name)+'</span>'+
          '<span class="grow"><b>'+esc(t.name)+'</b><span class="meta">'+t.n+' open case'+(t.n===1?'':'s')+'</span></span>'+
          (t.br? '<span class="badge b-risk">'+t.br+' breached</span>' : '<span class="badge b-idle">clear</span>')+'</div>').join('')+'</div></div>'+
    '</div>'+
  '</div>'+

  '<div class="card" style="margin-top:12px"><div class="card-h"><h2>Recent case activity</h2><a class="hint" href="#/cases">All cases</a></div>'+
    '<div class="card-b tight">'+(recent.length? recent.map(x=>{
      const c=x.c, a=x.a;
      return '<a class="row" href="#/case/'+c.id+'"><span class="avatar">'+initials(a.by||'Service desk')+'</span>'+
        '<span class="grow"><b>'+esc(a.type)+' · '+esc(c.ref)+'</b>'+
        '<span class="meta">'+esc((a.text||'').slice(0,96))+((a.text||'').length>96?'…':'')+' · '+esc(a.by||'Service desk')+'</span></span>'+
        '<span style="font-size:11.5px;color:var(--ink3);flex:none">'+esc(stroke(a.at))+'</span></a>';
    }).join('') : emptyBox('No activity yet','Log a case and the feed starts here.'))+'</div></div>';
}

/* ---------- CASES: list, board, detail ---------- */
const STAGE_HEX={ 'Intake':'#3E7FA8','Triage':'#C08A22','Awaiting info':'#9AA6AE','Parts / RMA':'#7A4E9E','Field work':'#0B5754','Resolved':'#215F45','Closed':'#8C99A3' };
const PRI_RANK={P1:1,P2:2,P3:3};
const CASE_SORT={
  ref:c=>c.ref,
  title:c=>String(c.title).toLowerCase(),
  ins:c=>insShort(c.installerId).toLowerCase(),
  pri:c=>PRI_RANK[c.priority]||9,
  stage:c=>STAGE_IDX[c.stage]||9,
  owner:c=>c.owner||'zzz',
  age:c=>c.openedAt,
  sla:c=>{ const s=slaState(c); return s.done? 1e15 : s.resDue; },
  updated:c=>c.updatedAt||0
};
function kv(k,v){ return '<div class="kv-row"><dt>'+esc(k)+'</dt><dd>'+(v? (String(v).indexOf('<')===0? v : esc(v)) : '—')+'</dd></div>'; }
function nl2br(s){ return esc(s||'').replace(/\n/g,'<br>'); }
function insOptions(sel, blank){
  return '<option value="">'+esc(blank||'Select installer…')+'</option>'+
    DB.installers.slice().sort((a,b)=>a.company.localeCompare(b.company))
      .map(i=>'<option value="'+i.id+'"'+(sel===i.id?' selected':'')+'>'+esc(companyNameOf(i)+' · '+(insFullName(i)||'no name'))+'</option>').join('');
}
function insFullName(i){ return [i.first,i.last].filter(Boolean).join(' ') || i.contact || ''; }
function compIdent(name){
  const base='co_'+String(name||'company').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,28);
  return base||'co_company';
}
function ensureCompany(name, src){
  const key=String(name||'').trim();
  if(!key) return null;
  let c=DB.companies.filter(x=>x.name.toLowerCase()===key.toLowerCase())[0];
  if(c) return c;
  let id=compIdent(key), n=2;
  while(DB.companies.some(x=>x.id===id)) id=compIdent(key)+'_'+(n++);
  c={id:id,name:key,tier:(src&&src.tier)||'Authorised installer',city:(src&&src.city)||'',
    state:(src&&src.state)||'',country:(src&&src.country)||'',phone:(src&&src.phone)||'',
    email:(src&&src.email)||'',notes:''};
  DB.companies.push(c);
  return c;
}
function compName(id){ const c=DB.companies.filter(x=>x.id===id)[0]; return c? c.name : ''; }
function compOptions(sel, blank){
  return '<option value="">'+esc(blank||'Choose a company…')+'</option>'+
    DB.companies.slice().sort((a,b)=>a.name.localeCompare(b.name))
      .map(c=>'<option value="'+esc(c.id)+'"'+(sel===c.id?' selected':'')+'>'+esc(c.name)+'</option>').join('');
}
function companyCases(id){ return DB.cases.filter(c=>c.companyId===id); }
function insLabel(i){
  const bits=[i.company, insFullName(i), i.phone].filter(Boolean);

function insMatch(i,q){

function caseOptions(sel){

    DB.cases.slice().sort((a,b)=>a.ref.localeCompare(b.ref))

function caseFiltered(){
  let list=DB.cases.slice();
  const q=(state.search||'').trim().toLowerCase();
  if(state.caseStage!=='all') list=list.filter(c=>c.stage===state.caseStage);
  if(state.casePri!=='all') list=list.filter(c=>c.priority===state.casePri);
  if(state.caseKind!=='all') list=list.filter(c=>c.kind===state.caseKind);
  if(state.caseIns!=='all') list=list.filter(c=>c.installerId===state.caseIns);
  if(state.caseWarranty==='in') list=list.filter(c=>{ const w=warrantyOf(c); return w.days!=null && w.days>=0; });
  if(state.caseWarranty==='out') list=list.filter(c=>{ const w=warrantyOf(c); return w.days!=null && w.days<0; });
  if(q) list=list.filter(c=> [c.ref,c.title,c.endUser,c.contact,c.owner,c.fault.category,c.fault.code,c.system.model,c.system.serial,c.kind,insShort(c.installerId),companyNameOf(byId.ins(c.installerId)),compName(c.companyId),c.site.city,c.site.state]
    .join(' ').toLowerCase().includes(q));
  return list;
}
function sortCases(list){
  const s=state.caseSort||{key:'sla',dir:1};
  const f=CASE_SORT[s.key]||CASE_SORT.sla;
  return list.slice().sort((a,b)=>{
    const ka=f(a), kb=f(b);
    if(typeof ka==='number' && typeof kb==='number') return (ka-kb)*s.dir;
    return String(ka).localeCompare(String(kb),'en',{numeric:true})*s.dir;
  });
}
function th(key,label){
  const s=state.caseSort||{key:'sla',dir:1};
  const on=s.key===key;
  const arrow=on? (s.dir===1?'\u2191':'\u2193') : '\u2195';
  return '<th class="sortable" data-act="sort" data-key="'+key+'"'+(on? ' aria-sort="'+(s.dir===1?'ascending':'descending')+'"':'')+'>'+
    esc(label)+'<span class="sarrow'+(on?' on':'')+'">'+arrow+'</span></th>';
}

/* ---------- installation & commissioning support ---------- */
const COMM_KEY='solarwatt.service.comm.v1';
let commState=null;
function commGroupSource(){
  const st=DB.settings=DB.settings||{};
  if(!Array.isArray(st.commGroups) || !st.commGroups.length){
    st.commGroups=JSON.parse(JSON.stringify(COMMISSION_GROUPS));
  }
  return st.commGroups;
}
function commStageNames(){
  const names=COMMISSION_STAGES.slice();
  commGroupSource().forEach(g=>{ if(g && g.stage && names.indexOf(g.stage)<0) names.push(g.stage); });
  return names;
}
function commLoad(){
  if(commState) return commState;
  let o={};
  try{ o=JSON.parse(localStorage.getItem(COMM_KEY)||'{}')||{}; }catch(err){ o={}; }
  commState={
    model:o.model||'', setup:o.setup==='bat'?'bat':'inv', battModel:o.battModel||'vision two 2.1',
    stage:commStageNames().indexOf(o.stage)>-1? o.stage:'all', installerId:o.installerId||'',
    checked:(o.checked&&typeof o.checked==='object')?o.checked:{},
    notes:(o.notes&&typeof o.notes==='object')?o.notes:{},
    updatedAt:o.updatedAt||0
  };
  return commState;
}
function commSave(){
  const s=commLoad(); s.updatedAt=Date.now();
  try{ localStorage.setItem(COMM_KEY, JSON.stringify(s)); }catch(err){ console.warn('commissioning session not saved', err); }
}
function commStepKey(gid,st){ return gid+':'+((st && st.sid)? st.sid : (st && st.idx!==undefined? st.idx : st)); }
function commBattRow(model){
  const p=kbProduct('bat21');
  if(!p) return null;
  return p.variants.rows.find(r=>String(r[0]).toLowerCase()===String(model||'').trim().toLowerCase()) || p.variants.rows[0];
}
function commPackCount(name){
  const words={two:2, three:3, four:4, five:5, six:6};
  const m=String(name||'').match(/vision ([a-z]+) 2\.1/i);
  return m && words[m[1].toLowerCase()]? String(words[m[1].toLowerCase()]):'';
}
function commCtx(s){
  const prod=kbProductForModel(s.model);
  const isThree=prod && prod.id==='visthree';
  const row=prod? (prod.variants.rows.find(r=>String(r[0]).toLowerCase()===String(s.model).trim().toLowerCase())||[]):[];
  const bat=s.setup==='bat';
  const b=bat? commBattRow(s.battModel):null;
  const fan=isThree && (s.model==='vision three 12.0' || s.model==='vision three 15.0');
  return {
    model:s.model||'the selected model',
    phase:isThree?'three phase':'single phase',
    vdc:isThree?'1,000 V DC':'600 V DC',
    mppt:isThree?'3':(row[2]||'3–4'),
    invMass:isThree?'35.5 kg':'29.5 kg',
    acVolt:isThree?'400 V L-L three phase':'230 V single phase',
    switchMs:isThree?'20 ms':'10 ms',
    fan:fan?' The fan-cooled 12–15 kW unit needs a clear intake.':'',
    battLoad:(bat&&b)? ' A battery stack adds '+b[3]+'.':'',
    battMountIntro:bat?' and battery stack':'',
    battSeat:bat?' or a pack that will not seat':'',
    battWindow:bat?'battery voltage window, ':'',
    battLift:bat?' and for each battery pack':'',
    battIntro:bat?', and a battery link that the inverter can actually see':'',
    battBreakers:bat?' and battery breakers':'',
    battPre:bat?', battery DC switch off, BMS buttons off':'',
    battWiring:bat?', battery':'',
    battFw:bat?' and BMS':'',
    battUsb:bat?', battery connected':'',
    battMon:bat?', battery':'',
    battLabel:bat?', battery':'',
    battPhoto:bat?'battery stack, ':'',
    battAsBuilt:bat?', battery variant and pack count':'',
    battReserve:bat?', battery reserve':'',
    battBlackStart:bat?', black start (battery: hold POWER 3 s, then press POWER three times within 4 s)':'',
    warranty:bat?'the battery 12+12 year warranty terms and the service contact':'the service contact',
    pack:(bat&&b)?commPackCount(b[0]):'',
    kwh:(bat&&b)?b[1]:'',
    volt:(bat&&b)?b[2]:'',
    bmass:(bat&&b)?b[3]:'',
    bname:(bat&&b)?b[0]:''
  };
}
function commFill(txt,s,ctx){
  const c=ctx||commCtx(s);
  return String(txt||'').replace(/\{(\w+)\}/g,(m,k)=> (c[k]===undefined? m: String(c[k])));
}
function commGroupsFor(s){
  const bat=s.setup==='bat';
  const prod=kbProductForModel(s.model);
  const fam=prod? prod.id:'';
  const ctx=commCtx(s);
  return commGroupSource().map(g=>{
    const steps=g.steps.map((st,idx)=>Object.assign({idx:idx}, st)).filter(st=>{
      if(st.needs==='bat' && !bat) return false;
      if(st.models && st.models.indexOf(fam)<0) return false;
      return true;
    }).map(st=>{ st.t=commFill(st.t,s,ctx); st.d=commFill(st.d,s,ctx); return st; });
    return {id:g.id, stage:g.stage, title:commFill(g.title,s,ctx), intro:commFill(g.intro,s,ctx), steps:steps};
  }).filter(g=>g.steps.length);
}
function commStats(groups,s){
  let total=0, done=0;
  groups.forEach(g=>g.steps.forEach(st=>{ total++; if(s.checked[commStepKey(g.id,st)]) done++; }));
  return {total:total, done:done};
}
function commSyncUI(){
  const s=commLoad(), groups=commGroupsFor(s), st=commStats(groups,s);
  const pct=st.total? Math.round(st.done/st.total*100):0;
  const c=document.querySelector('[data-comm-count]'); if(c) c.textContent=st.done+' of '+st.total+' steps';
  const f=document.querySelector('[data-comm-fill]'); if(f) f.style.width=pct+'%';
  groups.forEach(g=>{
    const n=g.steps.filter(st=>s.checked[commStepKey(g.id,st)]).length;
    const el=document.querySelector('[data-gcount="'+g.id+'"]'); if(el) el.textContent=n+'/'+g.steps.length;
  });
}
function commModelOptions(sel){
  return KB_PRODUCTS.filter(p=>p.id!=='bat21').map(p=>'<optgroup label="'+esc(p.name)+'">'+
    p.variants.rows.map(r=>'<option value="'+esc(r[0])+'"'+(String(sel)===r[0]?' selected':'')+'>'+esc(r[0])+' · '+esc(r[1])+'</option>').join('')+
  '</optgroup>').join('');
}
function commSummary(onlyStage){
  const s=commLoad();
  const label=s.model? systemSetupLabel({model:s.model, setup:s.setup, battModel:s.battModel}) : 'Model not selected';
  const all=commGroupsFor(s);
  const groups=(onlyStage && s.stage!=='all')? all.filter(g=>g.stage===s.stage) : all;
  const st=commStats(groups,s);
  const ins=s.installerId? byId.ins(s.installerId):null;
  const stageLabel=onlyStage? (s.stage==='all'? 'All stages':s.stage) : 'All stages';
  const lines=['SOLARWATT AU service — installation & commissioning checklist',
    'Stage: '+stageLabel,
    'Inverter: '+(s.model||'—'),
    'System setup: '+label,
    'Installer: '+(ins? (insFullName(ins)+' · '+companyNameOf(ins)) : 'not recorded'),
    'Date: '+todayISO(),
    'Progress: '+st.done+' of '+st.total+' steps'];
  if(!groups.length){ lines.push('', 'No steps are available for this stage and configuration yet.'); return lines.join('\n'); }
  groups.forEach(g=>{
    lines.push('', '━━ '+g.stage.toUpperCase()+' — '+g.title+' ━━');
    if(g.intro) lines.push(g.intro);
    g.steps.forEach((step,i)=>{ const k=commStepKey(g.id,step); const note=s.notes[k]||'';
      lines.push('', (s.checked[k]?'[x] ':'[ ] ')+(i+1)+'. '+step.t);
      if(step.d) lines.push('   Check: '+step.d);
      if(note) lines.push('   Site note: '+note);
    });
  });
  lines.push('', 'Work through the steps in order. Tick each one and record the reading or result. For support, send this checklist with photos of the label and display.');
  return lines.join('\n');
}

function viewSearch(){
  const q=String(state.gq||'').trim().toLowerCase();
  const empty='<div class="pg-head"><div><h1>Search</h1><p class="sub">Type in the search bar at the top — it searches every section without leaving the page.</p></div></div>'+
    emptyBox('Start typing above','Cases, enquiries, people, companies, alarm codes, playbooks and documents are all searched.');
  if(!q) return empty;
  const hit=a=>a.filter(Boolean).join(' ').toLowerCase().indexOf(q)>-1;
  const cases=DB.cases.filter(c=>{
    const ins=byId.ins(c.installerId);
    return hit([c.ref,c.title,c.endUser,c.contact,c.owner,c.kind,c.priority,c.stage,
      (c.system||{}).type,(c.system||{}).model,(c.system||{}).serial,(c.system||{}).capacity,
      (c.fault||{}).category,(c.fault||{}).code,(c.fault||{}).description,
      (c.site||{}).addr,(c.site||{}).city,(c.site||{}).state,
      ins? insFullName(ins):'', ins? companyNameOf(ins):'', compName(c.companyId)]);
  }).sort((a,b)=>b.openedAt-a.openedAt);
  const enqs=DB.enquiries.filter(e=>{
    const ins=byId.ins(e.installerId);
    return hit([e.ref,e.question,e.answer,e.contact,e.channel,e.topic,e.status,ins? insFullName(ins):'', ins? companyNameOf(ins):'']);
  }).sort((a,b)=>b.at-a.at);
  const people=DB.installers.filter(i=>insMatch(i,q) || hit([compName(i.contractTo)]))
    .sort((a,b)=>companyNameOf(a).localeCompare(companyNameOf(b)) || insFullName(a).localeCompare(insFullName(b)));
  const comps=DB.companies.filter(c=>hit([c.name,c.tier,c.city,c.state,c.country,c.phone,c.email,c.notes,
    DB.installers.filter(i=>i.companyId===c.id).map(insFullName).join(' ')]))
    .sort((a,b)=>a.name.localeCompare(b.name));
  const books=KB_PLAYBOOKS.filter(b=>hit([b.title,b.symptom,b.sev,b.cats.join(' '),b.topics.join(' '),b.checks.join(' '),b.stop,b.escalate]));
  const alarms=KB_ALARMS.filter(a=>hit([a[0],a[1],a[2],a[3]]));

    card('Documents', docs.length+' found', docsRows);
}

function lastTouch(insId){
  const cs=DB.cases.filter(c=>c.installerId===insId).map(c=>c.updatedAt||c.openedAt);
  const es=DB.enquiries.filter(e=>e.installerId===insId).map(e=>e.updatedAt||e.at);
  const all=cs.concat(es);
  return all.length? Math.max.apply(null, all) : 0;
}

/* ---------- ENQUIRIES ---------- */
function enquiryFiltered(){
  let list=DB.enquiries.slice();
  const q=(state.search||'').trim().toLowerCase();
  if(state.enqStatus!=='all') list=list.filter(e=>e.status===state.enqStatus);
  if(state.enqChannel!=='all') list=list.filter(e=>e.channel===state.enqChannel);
  if(state.enqIns!=='all') list=list.filter(e=>e.installerId===state.enqIns);
  if(q) list=list.filter(e=> [e.ref,e.topic,e.question,e.answer,e.contact,insShort(e.installerId)].join(' ').toLowerCase().includes(q));
  return list.sort((a,b)=>b.at-a.at);
}

function kbQ(){ return (state.kbSearch||'').trim().toLowerCase(); }
function kbHit(txt){ const q=kbQ(); return !q || String(txt||'').toLowerCase().indexOf(q)>-1; }
function kbTabBtn(){
  return KB_TABS.map(t=>'<button class="fbtn" data-act="kbTab" data-v="'+t[0]+'"'+(state.kbTab===t[0]?' style="background:var(--teal);color:#fff;border-color:var(--teal)"':'')+'>'+t[1]+'</button>').join('');
}
function kbFamLabel(f){ return f==='bat'?'Battery':f==='one'?'Vision one':f==='three'?'Vision three':'All products'; }
function kbDocCount(prodId){ return (DB.docs||[]).filter(d=>prodId==='all'? true : d.product===prodId).length; }

function viewKnowledge(sub,id){
  if(sub==='product') return kbProductPage(id);
  if(sub==='playbook') return kbPlaybookPage(id);
  if(sub==='comm'){ state.kbTab='comm'; return kbLanding(); }
  return kbLanding();
}

function kbLanding(){
  const q=kbQ();
  let body='';
  if(state.kbTab==='products') body=kbProductsBody();
  else if(state.kbTab==='comm') body=kbCommBody();
  else if(state.kbTab==='diagrams') body=kbDiagramsBody();
  else if(state.kbTab==='faults') body=kbFaultsBody();
  else if(state.kbTab==='codes') body=kbCodesBody();
  else if(state.kbTab==='warranty') body=kbWarrantyBody();
  else body=kbDocsBody();

/* ---------- REPORTS ---------- */
function reportRange(){
  const r=state.report;
  if(r.preset==='custom'){
    if(r.from && r.to) return {from:r.from, to:r.to};
    const d=todayD(); d.setDate(d.getDate()-89);
    return {from:isoOfTs(d.getTime()), to:todayISO()};
  }
  const days=Number(r.preset)||90;
  const d=todayD(); d.setDate(d.getDate()-(days-1));
  return {from:isoOfTs(d.getTime()), to:todayISO()};
}
function reportSet(){
  const {from,to}=reportRange();
  const f=(c)=>{
    if(state.report.ins!=='all' && c.installerId!==state.report.ins) return false;
    if(state.report.kind!=='all' && c.kind!==state.report.kind) return false;
    if(state.report.pri!=='all' && c.priority!==state.report.pri) return false;
    return true;
  };
  const cases=DB.cases.filter(c=>{ const d=isoOfTs(c.openedAt); return d>=from && d<=to && f(c); });
  const closed=DB.cases.filter(c=>c.resolvedAt && isoOfTs(c.resolvedAt)>=from && isoOfTs(c.resolvedAt)<=to && f(c));
  const enq=DB.enquiries.filter(e=>{
    if(state.report.ins!=='all' && e.installerId!==state.report.ins) return false;
    const d=isoOfTs(e.at); return d>=from && d<=to;
  });
  return {from,to,cases,closed,enq};
}
function bucketsBetween(fromISO,toISO){
  const a=parseISO(fromISO), b=parseISO(toISO);
  if(!a||!b) return [];
  const span=Math.max(1, Math.round((b-a)/86400000)+1);
  const n=Math.max(4, Math.min(13, Math.ceil(span/7)));
  const out=[];
  for(let i=0;i<n;i++){
    const s=new Date(a); s.setDate(a.getDate()+Math.floor(i*span/n));
    const e=new Date(a); e.setDate(a.getDate()+Math.floor((i+1)*span/n)-1);
    const endTs=Math.min(e.getTime(), b.getTime());
    out.push({l:fmtShort(s.getTime()), from:isoOfTs(s.getTime()), to:isoOfTs(endTs), full:fmtShort(s.getTime())+' – '+fmtShort(endTs)});
  }
  return out;
}
function pct(a,b){ return b? Math.round(a/b*100)+'%' : '—'; }
function segbar(rows){
  const total=rows.reduce((s,r)=>s+(Number(r.v)||0),0)||1;
  return '<div class="segbar">'+rows.map(r=>'<div style="width:'+(r.v/total*100).toFixed(1)+'%;background:'+r.c+'" title="'+esc(r.l+': '+r.v+' ('+pct(r.v,total)+')')+'"></div>').join('')+'</div>'+
    '<div class="legend" style="grid-template-columns:1fr 1fr">'+rows.map(r=>
      '<div class="lg"><i style="background:'+r.c+'"></i><span>'+esc(r.l)+'</span><b style="margin-left:auto">'+r.v+'</b></div>').join('')+'</div>';
}
